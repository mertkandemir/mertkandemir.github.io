<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VibeCheck Yönetim</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VC Yönetim" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f6f5fb;
        --panel: #fff;
        --ink: #1d1b2e;
        --muted: #6b6880;
        --line: #e4e1ef;
        --accent: #6c4cf5;
        --accent-soft: #efeafe;
        --danger: #d33c4a;
        --ok: #1f9d6b;
        --warn: #c98a12;
        --radius: 10px;
        font-size: 15px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14131c;
          --panel: #1d1b29;
          --ink: #ecebf5;
          --muted: #a09db5;
          --line: #312e44;
          --accent: #9d86ff;
          --accent-soft: #2a2442;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.45;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
      }
      nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      nav button {
        background: none;
        border: 0;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      nav button.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      header .who {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
      }
      .stat b {
        display: block;
        font-size: 24px;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 54px;
      }
      input[type='checkbox'] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      button.btn {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button.btn:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--danger);
      }
      button.small {
        padding: 3px 8px;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      /* Phones: wide tables scroll sideways instead of pushing buttons off screen. */
      .earn-chart {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 160px;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      .earn-col {
        flex: 1;
        min-width: 3px;
        height: 100%;
        display: flex;
        flex-direction: column-reverse;
        cursor: default;
      }
      .earn-col:hover {
        background: var(--accent-soft);
      }
      .earn-bar.sales,
      .earn-key.sales {
        background: var(--accent);
      }
      .earn-bar.ads,
      .earn-key.ads {
        background: var(--ok);
      }
      .earn-key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        vertical-align: middle;
      }
      .stat.tap {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        padding-right: 28px;
        -webkit-tap-highlight-color: transparent;
      }
      .stat.tap:hover,
      .stat.tap:focus-visible {
        border-color: var(--accent);
      }
      .stat.tap:active {
        background: var(--accent-soft);
      }
      .stat.tap i {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-style: normal;
        font-size: 22px;
        color: var(--muted);
      }
      dialog.sheet {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--ink);
        width: min(560px, 94vw);
        max-height: 85vh;
        padding: 16px 18px 20px;
        overflow-y: auto;
      }
      dialog.sheet::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .sheet-num {
        font-size: 28px;
      }
      .earn-chart.small {
        height: 90px;
      }
      .chart-ends {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 4px;
      }
      ul.list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      ul.list li > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .field {
        min-width: 0;
        max-width: 100%;
      }
      .field input,
      .field textarea,
      .field select {
        max-width: 100%;
        box-sizing: border-box;
      }
      @media (max-width: 700px) {
        dialog.sheet {
          width: 100vw;
          max-width: 100vw;
          margin: auto 0 0;
          border-radius: 16px 16px 0 0;
          max-height: 88vh;
          padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        .row > .field {
          flex: 1 1 100%;
        }
      }
      @media (max-width: 700px) {
        table {
          display: block;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        td .btn,
        td button {
          margin-bottom: 4px;
        }
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 14px;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        margin-right: 4px;
      }
      .tag.red {
        background: #fde8ea;
        color: var(--danger);
      }
      .tag.green {
        background: #e2f6ee;
        color: var(--ok);
      }
      .tag.gray {
        background: var(--line);
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 20;
        max-width: 90vw;
      }
      .toast.err {
        background: var(--danger);
        color: #fff;
      }
      .login {
        max-width: 380px;
        margin: 12vh auto;
      }
      .login input {
        width: 100%;
        margin-bottom: 10px;
      }
      .q {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        margin-bottom: 10px;
        background: var(--panel);
      }
      .q.ad {
        border-left: 4px solid var(--warn);
      }
      .q.premium {
        border-left: 4px solid var(--accent);
      }
      .opt {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .opt input[type='text'] {
        flex: 1;
      }
      .ref {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 0 4px;
      }
      .sticky-save {
        position: sticky;
        bottom: 0;
        background: var(--bg);
        padding: 10px 0;
        display: flex;
        gap: 10px;
        align-items: center;
        border-top: 1px solid var(--line);
      }
      .hidden {
        display: none !important;
      }
      label.inline {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin-right: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field span {
        font-size: 13px;
        color: var(--muted);
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

      // Public project values (the same ones the app ships with). Every admin action is
      // checked on the server: only accounts listed in private.admins can do anything.
      const SUPABASE_URL = 'https://mmljchdhmlcrrfctgvme.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_1NwUzGRqhedR_5_j4OVITw_RRr2D46n';
      const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, storageKey: 'vibecheck-admin' },
      });

      const LOCALES = ['tr', 'en', 'de', 'es', 'it', 'fr', 'ru'];
      const LOCALE_NAMES = {
        tr: 'Türkçe',
        en: 'English',
        de: 'Deutsch',
        es: 'Español',
        it: 'Italiano',
        fr: 'Français',
        ru: 'Русский',
      };
      const CATEGORY_NAMES = {
        personality: 'Kendini Keşfet (kişilik)',
        solo: 'Kendini Keşfet',
        friends: 'Friends',
        couples: 'Couple Match',
      };
      // Question dimensions: shown as the "map" in the app's detailed analysis.
      const DIMENSIONS = {
        couples: {
          communication: 'İletişim',
          daily_life: 'Günlük Yaşam',
          finance_career: 'Finans & Kariyer',
          social_boundaries: 'Sosyal Çevre',
          values_philosophy: 'Değerler',
        },
        friends: {
          social_fun: 'Eğlence & Planlar',
          loyalty_support: 'Sadakat',
          habits_quirks: 'Alışkanlıklar',
          communication_conflict: 'İletişim & Mizah',
          values_boundaries: 'Değerler',
        },
      };
      const TIER_NAMES = { base: 'Temel', ad: 'Reklamlı (+)', premium: 'Premium' };
      const ERRORS = {
        not_allowed: 'Bu hesabın yönetici yetkisi yok.',
        user_not_found: 'Kullanıcı bulunamadı.',
        invalid_config: 'Ayar değerleri geçersiz.',
        invalid_action: 'Bu işlem yapılamaz.',
        quiz_not_found: 'Quiz bulunamadı.',
        report_not_found: 'Şikayet bulunamadı.',
        invalid_pattern: 'Geçersiz kelime/kalıp.',
      };

      // ---------- tiny DOM helpers (text only: user content never becomes HTML) ----------
      function h(tag, props = {}, ...children) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
          if (v == null || v === false) continue;
          if (k === 'class') el.className = v;
          else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
          else if (k === 'value') el.value = v;
          else if (k === 'checked') el.checked = !!v;
          else el.setAttribute(k, v === true ? '' : v);
        }
        for (const c of children.flat())
          if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
        return el;
      }
      const $app = document.getElementById('app');
      const setMain = (...nodes) =>
        $main.replaceChildren(...nodes.flat().filter((n) => n != null && n !== false));
      let refreshSide = () => {};
      let toastTimer;
      function toast(msg, isError = false) {
        document.querySelector('.toast')?.remove();
        const el = h('div', { class: 'toast' + (isError ? ' err' : '') }, msg);
        document.body.append(el);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.remove(), isError ? 6000 : 2500);
      }
      function errText(e) {
        const m = (e && (e.message || e.error_description)) || String(e);
        for (const [k, v] of Object.entries(ERRORS)) if (m.includes(k)) return v;
        if (m.startsWith('invalid_quiz'))
          return 'Quiz kaydedilemedi: ' + m.replace('invalid_quiz:', '').trim();
        return m;
      }
      async function rpc(name, args) {
        const { data, error } = await sb.rpc(name, args);
        if (error) throw error;
        return data;
      }
      const fmtDate = (d) =>
        d ? new Date(d).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
      const uuid = () => crypto.randomUUID();

      // ---------- auth ----------
      let me = null;
      async function start() {
        const { data } = await sb.auth.getSession();
        if (!data.session) return renderLogin();
        me = data.session.user;
        let isAdmin = false;
        try {
          isAdmin = await rpc('admin_is');
        } catch {
          /* fall through */
        }
        if (!isAdmin) return renderNotAdmin();
        renderShell();
      }

      function renderLogin(note) {
        const email = h('input', {
          type: 'email',
          placeholder: 'E-posta',
          autocomplete: 'username',
        });
        const pass = h('input', {
          type: 'password',
          placeholder: 'Şifre',
          autocomplete: 'current-password',
        });
        const go = async (signup) => {
          if (!email.value || pass.value.length < 10)
            return toast('E-posta ve en az 10 karakterlik şifre gir.', true);
          const { error } = signup
            ? await sb.auth.signUp({ email: email.value.trim(), password: pass.value })
            : await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
          if (error) return toast(error.message, true);
          if (signup)
            return renderLogin(
              "Hesap oluşturuldu. E-postana gelen onay bağlantısına tıkla (açılan sayfa hata verse de sorun değil), sonra buradan giriş yap ve Claude'a haber ver.",
            );
          start();
        };
        pass.addEventListener('keydown', (e) => e.key === 'Enter' && go(false));
        $app.replaceChildren(
          h(
            'div',
            { class: 'panel login' },
            h('h2', {}, 'VibeCheck Yönetim'),
            note ? h('p', { class: 'muted' }, note) : null,
            email,
            pass,
            h(
              'div',
              { class: 'row' },
              h('button', { class: 'btn primary', onclick: () => go(false) }, 'Giriş yap'),
              h('button', { class: 'btn', onclick: () => go(true) }, 'İlk kez: hesap oluştur'),
            ),
          ),
        );
        email.focus();
      }

      function renderNotAdmin() {
        $app.replaceChildren(
          h(
            'div',
            { class: 'panel login' },
            h('h2', {}, 'Yetki yok'),
            h(
              'p',
              {},
              "Bu hesap henüz yönetici değil. Claude'a bu hesabı yönetici yapmasını söyle:",
            ),
            h('p', {}, h('code', {}, me.email || me.id)),
            h('button', { class: 'btn', onclick: logout }, 'Çıkış yap'),
          ),
        );
      }
      async function logout() {
        await sb.auth.signOut();
        me = null;
        renderLogin();
      }

      // ---------- shell ----------
      const TABS = [
        ['overview', 'Genel'],
        ['earnings', 'Kazançlar'],
        ['users', 'Kullanıcılar ve haklar'],
        ['reports', 'Şikayetler'],
        ['content', 'Sorular ve quizler'],
        ['settings', 'Uygulama ayarları'],
      ];
      let $main;
      function renderShell() {
        const nav = h(
          'nav',
          {},
          TABS.map(([id, label]) =>
            h('button', { 'data-tab': id, onclick: () => show(id) }, label),
          ),
        );
        $main = h('main');
        $app.replaceChildren(
          h(
            'header',
            {},
            h('h1', {}, 'VibeCheck Yönetim'),
            nav,
            h(
              'div',
              { class: 'who' },
              me.email || '',
              h('button', { class: 'btn small', onclick: logout }, 'Çıkış'),
            ),
          ),
          $main,
        );
        show(location.hash.slice(1) || 'overview');
      }
      async function show(tab) {
        if (dirty && !confirm('Kaydedilmemiş değişiklikler var. Yine de çıkılsın mı?')) return;
        dirty = false;
        location.hash = tab;
        document
          .querySelectorAll('nav button')
          .forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
        setMain(h('p', { class: 'muted' }, 'Yükleniyor…'));
        try {
          await VIEWS[tab]?.();
        } catch (e) {
          setMain(h('div', { class: 'panel' }, errText(e)));
        }
      }
      let dirty = false;
      window.addEventListener('beforeunload', (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // ---------- overview ----------
      async function viewOverview() {
        const [s, cfgAll] = await Promise.all([rpc('admin_stats'), rpc('admin_config')]);
        const minScore = (cfgAll.match_chat || {}).min_score;
        const items = [
          ['users', 'Toplam hesap'],
          ['registered', 'Apple/Google ile giriş'],
          ['new_24h', 'Son 24 saatte yeni'],
          ['couple_profiles', 'Couple Match profili'],
          ['searching_now', 'Şu an eşleşme arayan'],
          ['matches_24h', 'Eşleşme (24 saat)'],
          ['friend_sessions_24h', 'Friends oyunu (24 saat)'],
          ['solo_results_24h', 'Kendini Keşfet (24 saat)'],
          ['messages_24h', 'Mesaj (24 saat)'],
          ['open_reports', 'Açık şikayet'],
          ['bans', 'Engelli kullanıcı'],
          ['active_grants', 'Özel hak verilen'],
          ['purchases', 'Satın alma (toplam)'],
          ['ad_rewards', 'Ödüllü reklam (toplam)'],
          ['message_credits', 'Kullanıcılardaki mesaj bakiyesi'],
          ['match_credits', 'Kullanıcılardaki eşleşme hakkı'],
        ];
        const PRODUCT_LABELS = {
          'vibecheck.messages.25': '25 mesaj paketi',
          'vibecheck.messages.50': '50 mesaj paketi',
          'vibecheck.messages.100': '100 mesaj paketi',
          'vibecheck.couple.deep50': 'Derin test (+50 soru)',
          'vibecheck.chat.unlimited': 'Sınırsız sohbet (eski)',
          'vibecheck.matches.10': '10 eşleşme paketi',
          'vibecheck.matches.25': '25 eşleşme paketi',
          'vibecheck.matches.75': '75 eşleşme paketi',
        };
        const AD_LABELS = {
          tier: 'Ek sorular (+12)',
          messages: 'Mesaj (+3)',
          match: 'Eşleşme (+1)',
        };
        const chip = (on, onText, offText, warn) =>
          h(
            'span',
            { class: 'tag ' + (on ? (warn ? 'red' : 'green') : 'gray') },
            on ? onText : offText,
          );
        const products = s.purchases_by_product || [];
        const ads = s.ad_rewards_by_purpose || [];
        setMain(
          h('h2', {}, 'Genel durum'),
          h(
            'p',
            {},
            chip(s.review_demo, 'App Review modu AÇIK', 'App Review modu kapalı', true),
            ' ',
            chip(s.match_limit, 'Eşleşme sınırı açık', 'Eşleşme sınırı kapalı', false),
            ' ',
            h('span', { class: 'tag' }, `Mesajlaşma eşiği: %${minScore ?? '—'}`),
            ' ',
            h('a', { href: '#settings', onclick: () => show('settings') }, 'Ayarlar →'),
          ),
          s.review_demo
            ? h(
                'p',
                { class: 'muted' },
                'App Review modu açıkken arayan herkes ~20 saniye sonra demo partnerle eşleşir. Uygulama onaylanınca kapat.',
              )
            : null,
          h(
            'div',
            { class: 'grid' },
            items.map(([k, label]) =>
              h(
                'button',
                { class: 'stat tap', type: 'button', onclick: () => openStat(k, label, s[k] ?? 0) },
                h('b', {}, s[k] ?? 0),
                h('span', { class: 'muted' }, label),
                h('i', { 'aria-hidden': 'true' }, '›'),
              ),
            ),
          ),
          s.open_reports > 0
            ? h(
                'p',
                {},
                h(
                  'button',
                  { class: 'btn', onclick: () => show('reports') },
                  `${s.open_reports} açık şikayeti incele →`,
                ),
              )
            : null,
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Satın almalar'),
            products.length
              ? h(
                  'table',
                  {},
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      h('th', {}, 'Ürün'),

      // ---------- overview details (tap a number) ----------
      const STAT_TABS = {
        open_reports: 'reports',
        bans: 'users',
        active_grants: 'users',
        purchases: 'earnings',
        ad_rewards: 'earnings',
      };
      async function openUser(id) {
        await show('users');
        const q = document.querySelector('main input[type=search]');
        if (!q) return;
        q.value = id;
        q.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
      }
      async function openStat(key, label, value) {
        if (STAT_TABS[key]) return show(STAT_TABS[key]);
        const body = h('div', {}, h('p', { class: 'muted' }, 'Yükleniyor…'));
        const close = () => dlg.close();
        const dlg = h(
          'dialog',
          { class: 'sheet' },
          h(
            'div',
            { class: 'sheet-head' },
            h(
              'div',
              {},
              h('b', { class: 'sheet-num' }, value),
              h('div', { class: 'muted' }, label),
            ),
            h('button', { class: 'btn small', type: 'button', onclick: close }, 'Kapat'),
          ),
          body,
        );
        dlg.addEventListener('close', () => dlg.remove());
        dlg.addEventListener('click', (e) => e.target === dlg && close());
        document.body.append(dlg);
        dlg.showModal();
        try {
          const d = await rpc('admin_stat_detail', { p_key: key });
          const parts = [];
          if (d.daily) {
            const max = Math.max(1, ...d.daily.map((x) => x.n));
            const total = d.daily.reduce((a, x) => a + x.n, 0);
            parts.push(
              h('h3', {}, `Son 14 gün · ${total}`),
              h(
                'div',
                { class: 'earn-chart small' },
                d.daily.map((x) => {
                  const t = `${new Date(x.day + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' })}: ${x.n}`;
                  return h(
                    'div',
                    { class: 'earn-col', title: t, onclick: () => toast(t) },
                    h('div', { class: 'earn-bar sales', style: `height:${(x.n / max) * 100}%` }),
                  );
                }),
              ),
              h(
                'div',
                { class: 'chart-ends muted' },
                h('span', {}, '14 gün önce'),
                h('span', {}, 'Bugün'),
              ),
            );
          }
          parts.push(
            h('h3', {}, 'Son kayıtlar'),
            d.rows.length
              ? h(
                  'ul',
                  { class: 'list' },
                  d.rows.map((r) =>
                    h(
                      'li',
                      {},
                      h(
                        'div',
                        {},
                        h('div', {}, r.title),
                        h(
                          'div',
                          { class: 'muted' },
                          [r.sub, fmtDate(r.at)].filter(Boolean).join(' · '),
                        ),
                      ),
                      r.user_id

                            'button',
                            {
                              class: 'btn small',
                              type: 'button',
                              onclick: () => {
                                close();
                                openUser(r.user_id);
                              },
                            },
                            'Aç',
                          )
                        : null,
                    ),
                  ),
                )
              : h('p', { class: 'muted' }, 'Henüz kayıt yok.'),

          body.replaceChildren(h('p', {}, errText(e)));

      // ---------- earnings ----------
      // Store prices (USD) as set in App Store Connect; money here is an estimate.
      const PRICES_USD = {
        'vibecheck.messages.25': 0.99,
        'vibecheck.messages.50': 1.49,
        'vibecheck.messages.100': 2.49,
        'vibecheck.couple.deep50': 1.99,
        'vibecheck.matches.10': 3.99,
        'vibecheck.matches.25': 6.99,
        'vibecheck.matches.75': 14.99,
      };
      const EARN_LABELS = {
        'vibecheck.messages.25': '25 mesaj paketi',
        'vibecheck.messages.50': '50 mesaj paketi',
        'vibecheck.messages.100': '100 mesaj paketi',
        'vibecheck.couple.deep50': 'Derin test (+50 soru)',
        'vibecheck.chat.unlimited': 'Sınırsız sohbet (eski)',
        'vibecheck.matches.10': '10 eşleşme paketi',
        'vibecheck.matches.25': '25 eşleşme paketi',
        'vibecheck.matches.75': '75 eşleşme paketi',
      };
      const AD_KIND_LABELS = {
        'rewarded:tier': 'Ödüllü · ek sorular (+12)',
        'rewarded:messages': 'Ödüllü · mesaj (+3)',
        'rewarded:match': 'Ödüllü · eşleşme (+1)',
        'interstitial:': 'Geçiş reklamı (Kendini Keşfet)',
      };
      const EST_KEY = 'vc.admin.earnings.v1';
      function loadEst() {
        const d = { fee: 15, rewarded: 8, interstitial: 4, tests: false, days: '30' };
        try {
          return { ...d, ...JSON.parse(localStorage.getItem(EST_KEY) || '{}') };
        } catch {
          return d;
        }
      }
      function saveEst(e) {
        try {
          localStorage.setItem(EST_KEY, JSON.stringify(e));
        } catch {}
      }
      const usd = (n) =>
        '$' +
        (Math.round(n * 100) / 100).toLocaleString('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });

      async function viewEarnings() {
        const est = loadEst();
        const days = est.days === 'all' ? null : Number(est.days);
        const d = await rpc('admin_earnings', { p_days: days });
        const counts = (env) => env === 'production' || est.tests;
        const net = (gross) => gross * (1 - est.fee / 100);
        const adMoney = (kind, n) =>
          (n / 1000) * (kind === 'interstitial' ? est.interstitial : est.rewarded);

        // Sales per product (real only unless test purchases are switched on).
        const byProduct = {};
        let testCount = 0;
        for (const p of d.purchases) {
          if (p.environment !== 'production') testCount += p.count;
          if (!counts(p.environment)) continue;
          byProduct[p.product_id] = (byProduct[p.product_id] || 0) + p.count;
        }
        const productRows = Object.entries(byProduct)
          .map(([id, n]) => ({ id, n, gross: n * (PRICES_USD[id] || 0) }))
          .sort((a, b) => b.gross - a.gross);
        const sales = productRows.reduce((s, r) => s + r.n, 0);
        const gross = productRows.reduce((s, r) => s + r.gross, 0);

        const adRows = d.ads.map((a) => ({
          key: a.kind + ':' + (a.purpose || ''),
          kind: a.kind,
          n: a.count,
          today: a.today,
          money: adMoney(a.kind, a.count),
        }));
        const rewarded = adRows.filter((a) => a.kind === 'rewarded').reduce((s, a) => s + a.n, 0);
        const inter = adRows.filter((a) => a.kind === 'interstitial').reduce((s, a) => s + a.n, 0);
        const adsToday = adRows.reduce((s, a) => s + a.today, 0);
        const adEst = adRows.reduce((s, a) => s + a.money, 0);

        // Daily series: net sales + estimated ad money per Istanbul day.
        const series = {};
        const day = (k) => (series[k] ||= { sales: 0, ads: 0, n: 0, adN: 0 });
        for (const r of d.daily) {
          if (r.product_id) {
            if (!counts(r.environment)) continue;
            day(r.day).sales += net(r.count * (PRICES_USD[r.product_id] || 0));
            day(r.day).n += r.count;
          } else {
            day(r.day).ads += adMoney(r.ad_kind, r.count);
            day(r.day).adN += r.count;
          }
        }
        const dayKeys = [];
        if (days) {
          for (let i = days - 1; i >= 0; i--) {
            const t = new Date(Date.now() - i * 86400000);
            dayKeys.push(t.toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' }));
          }
        } else dayKeys.push(...Object.keys(series).sort());

        const rangeSel = h(
          'select',
          {
            onchange: (e) => {
              est.days = e.target.value;
              saveEst(est);
              show('earnings');
            },
          },
          [
            ['1', 'Bugün'],
            ['7', 'Son 7 gün'],
            ['30', 'Son 30 gün'],
            ['90', 'Son 90 gün'],
            ['all', 'Tüm zamanlar'],
          ].map(([v, l]) => h('option', { value: v, selected: est.days === v ? true : null }, l)),
        );
        const testToggle = h(
          'label',
          { style: 'display:flex;gap:6px;align-items:center' },
          h('input', {
            type: 'checkbox',
            checked: est.tests,
            onchange: (e) => {
              est.tests = e.target.checked;
              saveEst(est);
              show('earnings');
            },
          }),
          'Test (TestFlight/Sandbox) satın almalarını da say',
        );

        const tile = (value, label, sub) =>
          h(
            'div',
            { class: 'stat' },
            h('b', {}, value),
            h('span', { class: 'muted' }, label),
            sub ? h('div', { class: 'muted', style: 'font-size:12px' }, sub) : null,
          );

        const maxDay = Math.max(
          0.01,
          ...dayKeys.map((k) => (series[k]?.sales || 0) + (series[k]?.ads || 0)),
        );
        const chart = h(
          'div',
          { class: 'earn-chart' },
          dayKeys.map((k) => {
            const s = series[k] || { sales: 0, ads: 0, n: 0, adN: 0 };
            const title = `${k}\nSatış (net): ${usd(s.sales)} · ${s.n} adet\nReklam (tahmini): ${usd(s.ads)} · ${s.adN} izlenme`;
            return h(
              'div',
              { class: 'earn-col', title, onclick: () => toast(title.replace(/\n/g, ' · ')) },
              h('div', { class: 'earn-bar ads', style: `height:${(s.ads / maxDay) * 100}%` }),
              h('div', { class: 'earn-bar sales', style: `height:${(s.sales / maxDay) * 100}%` }),
            );
          }),
        );

        const num = (key, label, suffix) => {
          const input = h('input', {
            type: 'number',
            step: '0.5',
            min: '0',
            value: String(est[key]),
            style: 'width:90px',
            onchange: (e) => {
              const v = Number(e.target.value);
              if (!(v >= 0) || (key === 'fee' && v > 100)) return toast('Geçersiz değer', true);
              est[key] = v;
              saveEst(est);
              show('earnings');
            },
          });
          return h(
            'label',
            { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
            h('span', { style: 'flex:0 0 260px;max-width:100%' }, label),
            input,
            suffix,
          );
        };

        setMain(
          h('h2', {}, 'Kazançlar'),
          h('div', { class: 'row', style: 'gap:16px;flex-wrap:wrap' }, rangeSel, testToggle),
          testCount && !est.tests
            ? h(
                'p',
                { class: 'muted' },
                `${testCount} test satın alması (TestFlight/Sandbox) gizli; bunlar gerçek para değil.`,
              )
            : null,
          h(
            'div',
            { class: 'grid' },
            tile(usd(gross), 'Satış (brüt)', `${sales} satış`),
            tile(usd(net(gross)), `Satış (net, Apple %${est.fee} sonrası)`),
            tile(usd(adEst), 'Reklam geliri (tahmini)', "Kesin rakam AdMob'da"),
            tile(usd(net(gross) + adEst), 'Toplam (tahmini)'),
            tile(rewarded, 'Ödüllü reklam izlendi'),
            tile(inter, 'Geçiş reklamı gösterildi'),
            tile(adsToday, 'Bugün izlenen reklam'),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Günlük'),
            dayKeys.length ? chart : h('p', { class: 'muted' }, 'Bu dönemde veri yok.'),
            h(
              'p',
              { class: 'muted' },
              h('span', { class: 'earn-key sales' }),
              ' Satış (net)  ',
              h('span', { class: 'earn-key ads' }),
              ' Reklam (tahmini). Çubuğa dokununca/üstüne gelince o günün ayrıntısı görünür.',
            ),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Satışlar'),
            productRows.length
              ? h(
                  'table',
                  {},
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      h('th', {}, 'Ürün'),
                      h('th', {}, 'Adet'),
                      h('th', {}, 'Fiyat'),
                      h('th', {}, 'Brüt'),
                      h('th', {}, 'Net'),
                    ),
                  ),
                  h(
                    'tbody',
                    {},
                    productRows.map((r) =>
                      h(
                        'tr',
                        {},
                        h('td', {}, EARN_LABELS[r.id] || r.id),
                        h('td', {}, r.n),
                        h('td', {}, PRICES_USD[r.id] != null ? usd(PRICES_USD[r.id]) : '—'),
                        h('td', {}, usd(r.gross)),
                        h('td', {}, usd(net(r.gross))),
                      ),
                    ),
                  ),
                )
              : h('p', { class: 'muted' }, 'Bu dönemde satış yok.'),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Reklamlar'),
            adRows.length
              ? h(
                  'table',
                  {},
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      h('th', {}, 'Tür'),
                      h('th', {}, 'Bugün'),
                      h('th', {}, 'Dönem'),
                      h('th', {}, 'Tahmini gelir'),
                    ),
                  ),
                  h(
                    'tbody',
                    {},
                    adRows.map((a) =>
                      h(
                        'tr',
                        {},
                        h('td', {}, AD_KIND_LABELS[a.key] || a.key),
                        h('td', {}, a.today),
                        h('td', {}, a.n),
                        h('td', {}, usd(a.money)),
                      ),
                    ),
                  ),
                )
              : h('p', { class: 'muted' }, 'Bu dönemde izlenen reklam yok.'),
            h(
              'p',
              { class: 'muted' },
              "Ödüllü reklamlar AdMob'un sunucu doğrulamasıyla sayılır. Geçiş reklamları uygulamanın bu güncellemesinden itibaren sayılır" +
                (d.interstitial_logging_since
                  ? ` (ilk kayıt ${fmtDate(d.interstitial_logging_since)}).`
                  : '.'),
            ),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Tahmin ayarları'),
            h(
              'p',
              { class: 'muted' },
              'Bu değerler yalnızca bu tarayıcıda saklanır ve sadece tahmini hesaplamayı değiştirir.',
            ),
            num('fee', 'Apple komisyonu', '%'),
            num('rewarded', 'Ödüllü reklam: 1000 izlenme başına', '$ (eCPM)'),
            num('interstitial', 'Geçiş reklamı: 1000 gösterim başına', '$ (eCPM)'),
            h(
              'p',
              { class: 'muted' },
              "Fiyatlar ABD mağaza fiyatlarıdır; Türkiye gibi başka ülkelerdeki fiyat ve vergiler farklıdır. Kesin satış geliri: App Store Connect → Payments and Financial Reports. Kesin reklam geliri: AdMob → Uygulamalar → VibeCheck. Apple Small Business Program'a kayıtlıysan komisyon %15, değilsen %30.",
            ),
          ),
        );
      }

      // ---------- users & grants ----------
      async function viewUsers() {
        const q = h('input', {
          type: 'search',
          placeholder: 'Takma ad, e-posta veya kullanıcı kimliği',
          style: 'flex:1;min-width:260px',
        });
        const results = h('div');
        const search = async () => {
          results.replaceChildren(h('p', { class: 'muted' }, 'Aranıyor…'));
          try {
            renderUserTable(results, await rpc('admin_users', { p_query: q.value }));
          } catch (e) {
            toast(errText(e), true);
          }
        };
        q.addEventListener('keydown', (e) => e.key === 'Enter' && search());
        const grantsBox = h('div');
        const bansBox = h('div');
        setMain(
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Kullanıcı ara'),
            h(
              'div',
              { class: 'row' },
              q,
              h('button', { class: 'btn primary', onclick: search }, 'Ara'),
            ),
            h(
              'p',
              { class: 'muted' },
              'Boş aramada son 50 hesap listelenir. Misafir (anonim) hesapların takma adı ve e-postası yoktur; kimlikle aranır.',
            ),
            results,
          ),
          h('div', { class: 'panel' }, h('h2', {}, 'Özel hak verilenler'), grantsBox),
          h('div', { class: 'panel' }, h('h2', {}, 'Engellenenler'), bansBox),
        );
        refreshSide = async () => {
          renderUserTable(grantsBox, await rpc('admin_grants'));
          renderUserTable(bansBox, await rpc('admin_bans'));
        };
        await refreshSide();
        search();
      }

      function renderUserTable(box, users) {
        if (!users.length) return box.replaceChildren(h('p', { class: 'muted' }, 'Kayıt yok.'));
        box.replaceChildren(
          h(
            'table',
            {},
            h(
              'thead',
              {},
              h(
                'tr',
                {},
                h('th', {}, 'Kullanıcı'),
                h('th', {}, 'Giriş'),
                h('th', {}, 'Durum'),
                h('th', {}, ''),
              ),
            ),
            h(
              'tbody',
              {},
              users.map((u) => userRow(u)),
            ),
          ),
        );
      }

      function userRow(u) {
        const tr = h('tr');
        const fill = (u) => {
          const g = u.grants;
          const expired = g && g.expires_at && new Date(g.expires_at) < new Date();
          tr.replaceChildren(
            h(
              'td',
              {},
              h('div', {}, `${u.avatar || ''} ${u.nickname || (u.anonymous ? 'Misafir' : '—')}`),
              h('div', { class: 'muted' }, u.email || ''),
              h('div', { class: 'muted' }, h('code', {}, u.id)),
            ),
            h(
              'td',
              {},
              h('div', {}, u.provider || '—'),
              h('div', { class: 'muted' }, 'Kayıt: ' + fmtDate(u.created_at)),
              h('div', { class: 'muted' }, 'Son giriş: ' + fmtDate(u.last_sign_in_at)),
            ),
            h(
              'td',
              {},
              u.is_admin ? h('span', { class: 'tag' }, 'yönetici') : null,
              u.banned
                ? h('span', { class: 'tag red', title: u.ban_reason || '' }, 'engelli')
                : null,
              u.reports_against
                ? h('span', { class: 'tag red' }, `${u.reports_against} şikayet`)
                : null,
              u.wallet_balance
                ? h('span', { class: 'tag green' }, `${u.wallet_balance} mesaj bakiyesi`)
                : null,
              u.match_balance
                ? h('span', { class: 'tag green' }, `${u.match_balance} eşleşme hakkı`)
                : null,
              g?.unlimited_chat ? h('span', { class: 'tag green' }, 'sınırsız mesaj') : null,
              g?.free_premium ? h('span', { class: 'tag green' }, 'ücretsiz ek sorular') : null,
              g?.ad_free ? h('span', { class: 'tag green' }, 'reklamsız') : null,
              expired ? h('span', { class: 'tag gray' }, 'süresi doldu') : null,
              g?.note ? h('div', { class: 'muted' }, 'Not: ' + g.note) : null,
              g?.expires_at
                ? h('div', { class: 'muted' }, 'Bitiş: ' + fmtDate(g.expires_at))
                : null,
            ),
            h(
              'td',
              { style: 'white-space:nowrap' },
              h('button', { class: 'btn small', onclick: () => openGrant(u, fill) }, 'Haklar'),
              ' ',
              h(
                'button',
                {
                  class: 'btn small',
                  onclick: () => {
                    const raw = prompt(
                      `${u.nickname || u.email || 'Bu kullanıcı'} için mesaj bakiyesine eklenecek sayı (düşmek için eksi yaz). Şu an: ${u.wallet_balance || 0}`,
                      '25',
                    );
                    const n = Math.trunc(Number(raw));
                    if (raw !== null && n)
                      act(
                        () => rpc('admin_wallet_add', { p_user: u.id, p_amount: n }),
                        fill,
                        'Mesaj bakiyesi güncellendi',
                      );
                  },
                },
                'Mesaj ekle',
              ),
              ' ',
              h(
                'button',
                {
                  class: 'btn small',
                  onclick: () => {
                    const raw = prompt(
                      `${u.nickname || u.email || 'Bu kullanıcı'} için eklenecek eşleşme hakkı (düşmek için eksi yaz). Şu an: ${u.match_balance || 0}`,
                      '5',
                    );
                    const n = Math.trunc(Number(raw));
                    if (raw !== null && n)
                      act(
                        () => rpc('admin_match_wallet_add', { p_user: u.id, p_amount: n }),
                        fill,
                        'Eşleşme hakkı güncellendi',
                      );
                  },
                },
                'Eşleşme ekle',
              ),
              ' ',
              u.banned
                ? h(
                    'button',
                    {
                      class: 'btn small',
                      onclick: () =>
                        act(
                          () =>
                            rpc('admin_unban', { p_user: u.id }).then(() => ({
                              ...u,
                              banned: false,
                            })),
                          fill,

        };
        patFilter.addEventListener('input', renderPats);
        const addPat = async () => {
          const v = patIn.value.trim();
          if (!v) return;
          // Words and phrases become a whole-word match (same rules as scripts/build_moderation.py);
          // anything with regex syntax like \m or [ ] is sent as written.
          const pattern = /\\[mM]|\[|\(\?/.test(v) ? v : toPattern(v);
          try {
            await rpc('admin_pattern_add', { p_pattern: pattern, p_action: patAction.value });

      const REASONS = {
        harassment: 'Taciz',
        spam: 'Spam',
        sexual_content: 'Cinsel içerik',
        hate: 'Nefret söylemi',
        other: 'Diğer',
        auto_review: 'Otomatik: incele',

      const ACTIONS = {
        block: { label: 'Engelle', tag: 'red' },

      };
      // Whole word or phrase, any case, Turkish i/ı/İ/I alike, any spacing, ' or ’.
      // Keep in step with to_pattern() in scripts/build_moderation.py.
      const toPattern = (entry) => {
        const e = entry.trim();
        let body = '';
        for (const ch of e.toLocaleLowerCase('tr')) {
          if (ch === 'i' || ch === 'ı') body += '[iıİI]';
          else if (ch === "'" || ch === '’') body += "['’]";
          else if (/\s/.test(ch)) body += body.endsWith('\\s+') ? '' : '\\s+';
          else if ('\\.^$|?*+()[]{}'.includes(ch)) body += '\\' + ch;
          else body += ch;
        }
        const word = (c) => /[\p{L}\p{N}]/u.test(c);
        const start = word(e[0]) ? '\\m' : '(?<![[:alnum:]_])';
        const end = word(e[e.length - 1]) ? '\\M' : '(?![[:alnum:]_])';
        return start + body + end;
      };

                      premium_product_id: prem.value.trim(),
                      chat_product_id: chatProd.value.trim(),
                      message_packs: parsePacks(),
                      rewarded_unit_ios: rwIos.value.trim(),
                      rewarded_unit_android: rwAnd.value.trim(),
                    }),
                },
                'Kaydet',
              ),
            ),
          ),
        );
      }

      // ---------- content ----------
      async function viewContent() {
        const quizzes = await rpc('admin_quizzes');
        const byCat = {};
        for (const q of quizzes) (byCat[q.category] ||= []).push(q);
        const statusTag = (s) =>
          h(
            'span',
            { class: 'tag ' + (s === 'published' ? 'green' : s === 'draft' ? '' : 'gray') },
            { published: 'yayında', draft: 'taslak', archived: 'arşiv' }[s],
          );
        setMain(
          h(
            'div',
            { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' },
            h('h2', { style: 'margin:0' }, 'Sorular ve quizler'),
            h('button', { class: 'btn primary', onclick: () => openEditor(null) }, '+ Yeni quiz'),
          ),
          ...Object.keys(CATEGORY_NAMES)
            .filter((c) => byCat[c])
            .map((c) =>
              h(
                'div',
                { class: 'panel' },
                h('h3', {}, CATEGORY_NAMES[c]),
                h(
                  'table',
                  {},
                  h(
                    'tbody',
                    {},
                    byCat[c].map((q) =>
                      h(
                        'tr',
                        {},
                        h(
                          'td',
                          {},
                          h('b', {}, q.titles.tr || q.titles.en || q.slug),
                          h('div', { class: 'muted' }, q.slug),
                        ),
                        h(
                          'td',
                          {},
                          Object.entries(q.counts).map(([t, n]) =>
                            h('span', { class: 'tag gray' }, `${TIER_NAMES[t]}: ${n}`),
                          ),
                          q.play_mode === 'prediction'
                            ? h('span', { class: 'tag' }, 'tahmin modu')
                            : null,
                        ),
                        h(
                          'td',
                          {},
                          statusTag(q.status),
                          h(
                            'span',
                            { class: 'muted' },
                            `${LOCALES.filter((l) => q.titles[l]).length}/7 dil`,
                          ),
                        ),
                        h(
                          'td',
                          { style: 'white-space:nowrap;text-align:right' },
                          h(
                            'button',
                            { class: 'btn small', onclick: () => openEditor(q.id) },
                            'Düzenle',
                          ),
                          ' ',
                          q.status !== 'published'
                            ? h(
                                'button',
                                { class: 'btn small', onclick: () => setStatus(q.id, 'published') },
                                'Yayınla',
                              )
                            : h(
                                'button',
                                { class: 'btn small', onclick: () => setStatus(q.id, 'draft') },
                                'Yayından al',
                              ),
                        ),
                      ),
                    ),
                  ),
                ),
              ),
            ),
        );
      }
      async function setStatus(id, status) {
        try {
          await rpc('admin_quiz_set_status', { p_quiz: id, p_status: status });
          toast(status === 'published' ? 'Yayınlandı' : 'Yayından alındı');
          show('content');
        } catch (e) {
          toast(errText(e), true);
        }
      }

      let editLocale = 'tr';
      async function openEditor(id) {
        const quiz = id
          ? await rpc('admin_quiz_get', { p_quiz: id })
          : {
              id: uuid(),
              slug: '',
              category: 'friends',
              status: 'draft',
              sort_order: 0,
              play_mode: 'prediction',
              translations: {},
              outcomes: [],
              questions: [],
            };
        dirty = false;
        renderEditor(quiz, !id);
      }

      function renderEditor(quiz, isNew) {
        const markDirty = () => {
          dirty = true;
        };
        const scored = () => quiz.category === 'personality' || quiz.category === 'solo';
        const tiered = () => quiz.category === 'couples';
        const tr = (obj, key = editLocale) => (obj || {})[key] || '';

        const localeSel = h(
          'select',
          {
            onchange: (e) => {
              editLocale = e.target.value;
              renderEditor(quiz, isNew);
            },
          },
          LOCALES.map((l) =>
            h('option', { value: l, selected: l === editLocale ? true : null }, LOCALE_NAMES[l]),
          ),
        );
        const refNote = (obj) =>
          editLocale !== 'en' && obj?.en
            ? h(
                'div',
                { class: 'ref' },
                'EN: ' + (typeof obj.en === 'string' ? obj.en : obj.en.title),
              )
            : null;

        // --- meta ---
        const slug = h('input', {
          type: 'text',
          value: quiz.slug,
          placeholder: 'ornek-quiz-adi',
          oninput: (e) => {
            quiz.slug = e.target.value;
            markDirty();
          },
        });
        const cat = h(
          'select',
          {
            onchange: (e) => {
              quiz.category = e.target.value;
              markDirty();
              renderEditor(quiz, isNew);
            },
          },
          Object.entries(CATEGORY_NAMES).map(([k, v]) =>
            h('option', { value: k, selected: k === quiz.category ? true : null }, v),
          ),
        );
        const mode = h(
          'select',
          {
            onchange: (e) => {
              quiz.play_mode = e.target.value;
              markDirty();
            },
          },
          h(
            'option',
            { value: 'match', selected: quiz.play_mode === 'match' ? true : null },
            'Eşleşme (aynı cevap = uyum)',
          ),
          h(
            'option',
            { value: 'prediction', selected: quiz.play_mode === 'prediction' ? true : null },
            'Tahmin (önce kendin, sonra arkadaşını tahmin et)',
          ),
        );
        const sort = h('input', {
          type: 'number',
          value: quiz.sort_order,
          style: 'width:80px',
          oninput: (e) => {
            quiz.sort_order = Number(e.target.value) || 0;
            markDirty();
          },
        });
        const status = h(
          'select',
          {
            onchange: (e) => {
              quiz.status = e.target.value;
              markDirty();
            },
          },
          ['draft', 'published', 'archived'].map((s) =>
            h(
              'option',
              { value: s, selected: s === quiz.status ? true : null },
              { draft: 'Taslak', published: 'Yayında', archived: 'Arşiv' }[s],
            ),
          ),
        );
        const title = h('input', {
          type: 'text',
          value: tr(quiz.translations)?.title || '',
          style: 'width:100%',
          oninput: (e) => {
            quiz.translations[editLocale] = {
              ...(quiz.translations[editLocale] || {}),
              title: e.target.value,
            };
            markDirty();
          },
        });
        const desc = h(
          'textarea',
          {
            oninput: (e) => {
              quiz.translations[editLocale] = {
                ...(quiz.translations[editLocale] || {}),
                description: e.target.value,
              };
              markDirty();
            },
          },
          tr(quiz.translations)?.description || '',
        );

        // --- outcomes (scored quizzes) ---
        const outcomesPanel = !scored()
          ? null
          : h(
              'div',
              { class: 'panel' },
              h('h3', {}, 'Sonuçlar'),
              h(
                'p',
                { class: 'muted' },
                'Her şık bir sonuca bağlanır; en çok seçilen sonuç kişinin sonucu olur.',
              ),
              quiz.outcomes.map((o, i) =>
                h(
                  'div',
                  { class: 'q' },
                  h(
                    'div',
                    { class: 'row' },
                    h('b', {}, `Sonuç ${i + 1}`),
                    h(
                      'button',
                      {
                        class: 'btn small danger',
                        onclick: () => {
                          if (confirm('Bu sonuç silinsin mi? Ona bağlı şıklar boşa düşer.')) {
                            quiz.outcomes.splice(i, 1);
                            markDirty();
                            renderEditor(quiz, isNew);
                          }
                        },
                      },
                      'Sil',
                    ),
                  ),
                  h('input', {
                    type: 'text',
                    placeholder: 'Sonuç adı',
                    value: tr(o.translations)?.title || '',
                    style: 'width:100%;margin-top:6px',
                    oninput: (e) => {
                      o.translations[editLocale] = {
                        ...(o.translations[editLocale] || {}),
                        title: e.target.value,
                      };
                      markDirty();
                    },
                  }),
                  refNote(o.translations),
                  h(
                    'textarea',
                    {
                      placeholder: 'Açıklama',
                      oninput: (e) => {
                        o.translations[editLocale] = {
                          ...(o.translations[editLocale] || {}),
                          description: e.target.value,
                        };
                        markDirty();
                      },
                    },
                    tr(o.translations)?.description || '',
                  ),
                ),
              ),
              h(
                'button',
                {
                  class: 'btn',
                  onclick: () => {
                    quiz.outcomes.push({ id: uuid(), translations: {} });
                    markDirty();
                    renderEditor(quiz, isNew);
                  },
                },
                '+ Sonuç ekle',
              ),
            );

        // --- questions ---
        const outcomeName = (o, i) =>
          tr(o.translations)?.title ||
          o.translations?.en?.title ||
          o.translations?.tr?.title ||
          `Sonuç ${i + 1}`;
        const moveQ = (i, d) => {
          const j = i + d;
          if (j < 0 || j >= quiz.questions.length) return;
          [quiz.questions[i], quiz.questions[j]] = [quiz.questions[j], quiz.questions[i]];
          markDirty();
          renderEditor(quiz, isNew);
        };
        const questionCards = quiz.questions.map((qn, i) => {
          const filled = LOCALES.filter((l) => qn.translations?.[l]).length;
          return h(
            'div',
            { class: 'q ' + (qn.tier || 'base') },
            h(
              'div',
              { class: 'row', style: 'justify-content:space-between' },
              h(
                'div',
                { class: 'row' },
                h('b', {}, `Soru ${i + 1}`),
                tiered()
                  ? h(
                      'select',
                      {
                        onchange: (e) => {
                          qn.tier = e.target.value;
                          markDirty();
                          renderEditor(quiz, isNew);
                        },
                      },
                      Object.entries(TIER_NAMES).map(([k, v]) =>
                        h(
                          'option',
                          { value: k, selected: k === (qn.tier || 'base') ? true : null },
                          v,
                        ),
                      ),
                    )
                  : null,
                DIMENSIONS[quiz.category]
                  ? h(
                      'select',
                      {
                        title: 'Analiz boyutu',
                        onchange: (e) => {
                          qn.dimension = e.target.value || null;
                          markDirty();
                        },
                      },
                      [
                        h('option', { value: '' }, 'Boyut yok'),
                        ...Object.entries(DIMENSIONS[quiz.category]).map(([k, v]) =>
                          h('option', { value: k, selected: k === qn.dimension ? true : null }, v),
                        ),
                      ],
                    )
                  : null,
                h('span', { class: 'tag ' + (filled === 7 ? 'green' : 'gray') }, `${filled}/7 dil`),
              ),
              h(
                'div',
                { class: 'row' },
                h(
                  'button',
                  { class: 'btn small', title: 'Yukarı', onclick: () => moveQ(i, -1) },
                  '↑',
                ),
                h(
                  'button',
                  { class: 'btn small', title: 'Aşağı', onclick: () => moveQ(i, 1) },
                  '↓',
                ),
                h(
                  'button',
                  {
                    class: 'btn small danger',
                    onclick: () => {
                      if (confirm('Soru silinsin mi?')) {
                        quiz.questions.splice(i, 1);
                        markDirty();
                        renderEditor(quiz, isNew);
                      }
                    },
                  },
                  'Sil',
                ),
              ),
            ),
            h(
              'textarea',
              {
                placeholder: `Soru metni (${LOCALE_NAMES[editLocale]})`,
                style: 'margin-top:6px',
                oninput: (e) => {
                  qn.translations[editLocale] = e.target.value;
                  markDirty();
                },
              },
              tr(qn.translations),
            ),
            refNote(qn.translations),
            qn.options.map((op, k) =>
              h(
                'div',
                { class: 'opt' },
                h('span', { class: 'muted' }, String.fromCharCode(65 + k)),
                h('input', {
                  type: 'text',
                  placeholder: 'Şık',
                  value: tr(op.translations),
                  oninput: (e) => {
                    op.translations[editLocale] = e.target.value;
                    markDirty();
                  },
                }),
                scored()
                  ? h(
                      'select',
                      {
                        onchange: (e) => {
                          op.outcome_id = e.target.value || null;
                          markDirty();
                        },
                      },
                      h('option', { value: '' }, '— sonuç seç —'),
                      quiz.outcomes.map((o, oi) =>
                        h(
                          'option',
                          { value: o.id, selected: o.id === op.outcome_id ? true : null },
                          outcomeName(o, oi),
                        ),
                      ),
                    )
                  : null,
                h(
                  'button',
                  {
                    class: 'btn small',
                    title: 'Şıkkı sil',
                    disabled: qn.options.length <= 2 ? true : null,
                    onclick: () => {
                      qn.options.splice(k, 1);
                      markDirty();
                      renderEditor(quiz, isNew);
                    },
                  },
                  '×',
                ),
              ),
            ),
            h(
              'button',
              {
                class: 'btn small',
                style: 'margin-top:8px',
                onclick: () => {
                  qn.options.push({ id: uuid(), outcome_id: null, translations: {} });
                  markDirty();
                  renderEditor(quiz, isNew);
                },
              },
              '+ Şık',
            ),
          );
        });
        const addQuestion = () => {
          // New questions start with the same answer choices as the first question (e.g. Always / Depends / Never).
          const tpl = quiz.questions[0]?.options;
          const options = tpl
            ? tpl.map((o) => ({
                id: uuid(),
                outcome_id: scored() ? o.outcome_id : null,
                translations: { ...o.translations },
              }))
            : [
                { id: uuid(), outcome_id: null, translations: {} },
                { id: uuid(), outcome_id: null, translations: {} },
              ];
          const tier = tiered() ? quiz.questions.at(-1)?.tier || 'base' : 'base';
          const dimension = quiz.questions.at(-1)?.dimension || null;
          quiz.questions.push({ id: uuid(), tier, dimension, translations: {}, options });
          markDirty();
          renderEditor(quiz, isNew);
          setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
        };

        const missing = LOCALES.map((l) => [
          l,
          quiz.questions.filter((q) => !q.translations?.[l]).length,
        ]).filter(([, n]) => n);
        const counts = ['base', 'ad', 'premium']
          .map((t) => [t, quiz.questions.filter((q) => (q.tier || 'base') === t).length])
          .filter(([, n]) => n);

        const saveBtn = h(
          'button',
          {
            class: 'btn primary',
            onclick: async () => {
              // Questions are saved grouped by tier (base, then ad, then premium) in this order.
              const order = { base: 0, ad: 1, premium: 2 };
              const payload = {
                ...quiz,
                questions: [...quiz.questions].sort(
                  (a, b) => order[a.tier || 'base'] - order[b.tier || 'base'],
                ),
              };
              saveBtn.disabled = true;
              try {
                const saved = await rpc('admin_quiz_save', { p: payload });
                dirty = false;
                toast('Kaydedildi');
                renderEditor(saved, false);
              } catch (e) {
                toast(errText(e), true);
                saveBtn.disabled = false;
              }
            },
          },
          'Kaydet',
        );

        setMain(
          h(
            'div',
            { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' },
            h('button', { class: 'btn', onclick: () => show('content') }, '← Quiz listesi'),
            h('div', { class: 'row' }, h('span', { class: 'muted' }, 'Düzenlenen dil:'), localeSel),
          ),
          h(
            'div',
            { class: 'panel' },
            h(
              'h2',
              {},
              isNew
                ? 'Yeni quiz'
                : quiz.translations.tr?.title || quiz.translations.en?.title || quiz.slug,
            ),
            h(
              'div',
              { class: 'row' },
              h('label', { class: 'field' }, h('span', {}, 'Bölüm'), cat),
              h(
                'label',
                { class: 'field' },
                h('span', {}, 'Kısa ad (URL, küçük harf ve tire)'),
                slug,
              ),
              quiz.category === 'friends' || quiz.category === 'couples'
                ? h('label', { class: 'field' }, h('span', {}, 'Oyun türü'), mode)
                : null,
              h('label', { class: 'field' }, h('span', {}, 'Sıra'), sort),
              h('label', { class: 'field' }, h('span', {}, 'Durum'), status),
            ),
            h(
              'label',
              { class: 'field', style: 'margin-top:12px' },
              h('span', {}, `Başlık (${LOCALE_NAMES[editLocale]})`),
              title,
            ),
            refNote(quiz.translations),
            h(
              'label',
              { class: 'field', style: 'margin-top:8px' },
              h('span', {}, `Açıklama (${LOCALE_NAMES[editLocale]})`),
              desc,
            ),
            tiered()
              ? h(
                  'p',
                  { class: 'muted' },
                  'Couple Match: Temel sorular herkese açık; Reklamlı ve Premium sorular ek paketlerdir. Sıralama paket içinde geçerlidir.',
                )
              : null,
          ),
          outcomesPanel,
          h(
            'div',
            {},
            h('h3', {}, `Sorular (${quiz.questions.length})`),
            questionCards,
            h('button', { class: 'btn', onclick: addQuestion }, '+ Soru ekle'),
          ),
          h(
            'div',
            { class: 'sticky-save' },
            saveBtn,
            h(
              'span',
              { class: 'muted' },
              counts.map(([t, n]) => `${TIER_NAMES[t]}: ${n}`).join(' · '),
            ),
            missing.length
              ? h(
                  'span',
                  { class: 'muted' },
                  ' · Eksik çeviri: ' +
                    missing.map(([l, n]) => `${l.toUpperCase()} ${n}`).join(', '),
                )
              : null,
            quiz.status === 'published'
              ? h('span', { class: 'tag green' }, 'Kaydedince hemen yayına girer')
              : null,
          ),
        );
      }

      const VIEWS = {
        overview: viewOverview,
        earnings: viewEarnings,
        users: viewUsers,
        reports: viewReports,
        content: viewContent,
        settings: viewSettings,
      };
      sb.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') renderLogin();
      });
      start();
    </script>
  </body>
</html>
