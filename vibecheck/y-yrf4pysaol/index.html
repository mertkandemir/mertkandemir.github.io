<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VibeCheck Yönetim</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VC Yönetim" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f6f5fb;
        --panel: #fff;
        --ink: #1d1b2e;
        --muted: #6b6880;
        --line: #e4e1ef;
        --accent: #6c4cf5;
        --accent-soft: #efeafe;
        --danger: #d33c4a;
        --ok: #1f9d6b;
        --warn: #c98a12;
        --radius: 10px;
        font-size: 15px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #14131c;
          --panel: #1d1b29;
          --ink: #ecebf5;
          --muted: #a09db5;
          --line: #312e44;
          --accent: #9d86ff;
          --accent-soft: #2a2442;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.45;
      }
      /* ---------- shell: sidebar on computers, tab bar on phones ---------- */
      .app {
        min-height: 100vh;
      }
      .side {
        display: none;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: saturate(1.4) blur(14px);
        -webkit-backdrop-filter: saturate(1.4) blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .topbar h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar .brand-mini {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      .ico {
        display: inline-flex;
        width: 22px;
        height: 22px;
        flex: none;
      }
      .ico svg {
        width: 100%;
        height: 100%;
      }
      .navbtn {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .navbtn.on {
        color: var(--accent);
      }
      .badge {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--danger);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .badge:empty {
        display: none;
      }
      .tabbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: saturate(1.4) blur(16px);
        -webkit-backdrop-filter: saturate(1.4) blur(16px);
        border-top: 1px solid var(--line);
      }
      .tabbar .navbtn {
        flex-direction: column;
        gap: 2px;
        padding: 4px 0;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        justify-content: center;
        min-height: 48px;
      }
      .tabbar .badge {
        position: absolute;
        top: 0;
        left: calc(50% + 6px);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
      }
      .page-title {
        display: none;
      }
      main > h2.page-title-h {
        display: none;
      }
      .more-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 12px;
      }
      .more-item {
        padding: 14px 10px;
        border-radius: 12px;
        color: var(--ink) !important;
        font-size: 16px;
      }
      .more-item:active {
        background: var(--accent-soft);
      }
      .more-item.danger {
        color: var(--danger) !important;
      }
      @media (prefers-color-scheme: dark) {
        .tag.red {
          background: rgba(211, 60, 74, 0.18);
        }
        .tag.green {
          background: rgba(31, 157, 107, 0.18);
        }
      }
      @media (min-width: 900px) {
        .app {
          display: grid;
          grid-template-columns: 248px 1fr;
        }
        .side {
          display: flex;
          flex-direction: column;
          position: sticky;
          top: 0;
          height: 100vh;
          padding: 20px 14px;
          background: var(--panel);
          border-right: 1px solid var(--line);
        }
        .side .brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 8px 18px;
          font-weight: 700;
          font-size: 16px;
        }
        .side .brand img {
          width: 32px;
          height: 32px;
          border-radius: 9px;
        }
        .side nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .side .navbtn {
          padding: 10px 12px;
          border-radius: 10px;
          font-weight: 500;
        }
        .side .navbtn:hover {
          background: var(--bg);
          color: var(--ink);
        }
        .side .navbtn.on {
          background: var(--accent-soft);
          color: var(--accent);
          font-weight: 600;
        }
        .side .navbtn .badge {
          margin-left: auto;
        }
        .side .foot {
          margin-top: auto;
          padding: 12px 8px 0;
          border-top: 1px solid var(--line);
          font-size: 13px;
          color: var(--muted);
          display: flex;
          flex-direction: column;
          gap: 8px;
          overflow-wrap: anywhere;
        }
        .topbar,
        .tabbar {
          display: none;
        }
        main {
          padding: 28px 32px 48px;
        }
        main > h2.page-title-h {
          display: block;
          font-size: 24px;
          margin: 0 0 18px;
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(20, 16, 40, 0.04);
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 1px 2px rgba(20, 16, 40, 0.04);
      }
      .stat b {
        display: block;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 54px;
      }
      input[type='checkbox'] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      button.btn {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button.btn:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--danger);
      }
      button.small {
        padding: 3px 8px;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      /* Phones: wide tables scroll sideways instead of pushing buttons off screen. */
      .earn-chart {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 160px;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      .earn-col {
        flex: 1;
        min-width: 3px;
        height: 100%;
        display: flex;
        flex-direction: column-reverse;
        cursor: default;
      }
      .earn-col:hover {
        background: var(--accent-soft);
      }
      .earn-bar.sales,
      .earn-key.sales {
        background: var(--accent);
      }
      .earn-bar.ads,
      .earn-key.ads {
        background: var(--ok);
      }
      .earn-key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        vertical-align: middle;
      }
      .stat.tap {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        padding-right: 28px;
        -webkit-tap-highlight-color: transparent;
      }
      .stat.tap:hover,
      .stat.tap:focus-visible {
        border-color: var(--accent);
      }
      .stat.tap:active {
        background: var(--accent-soft);
      }
      .stat.tap i {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-style: normal;
        font-size: 22px;
        color: var(--muted);
      }
      dialog.sheet {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--ink);
        width: min(560px, 94vw);
        max-height: 85vh;
        padding: 16px 18px 20px;
        overflow-y: auto;
      }
      dialog.sheet::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .sheet-num {
        font-size: 28px;
      }
      .earn-chart.small {
        height: 90px;
      }
      .chart-ends {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 4px;
      }
      ul.list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      ul.list li > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .field {
        min-width: 0;
        max-width: 100%;
      }
      .field input,
      .field textarea,
      .field select {
        max-width: 100%;
        box-sizing: border-box;
      }
      @media (max-width: 700px) {
        dialog.sheet {
          width: 100vw;
          max-width: 100vw;
          margin: auto 0 0;
          border-radius: 16px 16px 0 0;
          max-height: 88vh;
          padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        .row > .field {
          flex: 1 1 100%;
        }
      }
      /* Phones: every table row becomes a card; each cell shows its column name. */
      @media (max-width: 700px) {
        table.auto thead {
          display: none;
        }
        table.auto,
        table.auto tbody,
        table.auto tr,
        table.auto td {
          display: block;
          width: 100%;
        }
        table.auto tr {
          border: 1px solid var(--line);
          border-radius: 12px;
          padding: 10px 12px;
          margin-bottom: 10px;
          background: var(--panel);
        }
        .panel table.auto tr {
          background: var(--bg);
        }
        table.auto td {
          border: 0 !important;
          padding: 3px 0 !important;
          white-space: normal !important;
        }
        table.auto td[data-label]::before {
          content: attr(data-label);
          display: block;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--muted);
        }
        td .btn,
        td button {
          margin: 4px 4px 0 0;
        }
        input,
        select,
        textarea {
          font-size: 16px; /* below 16px iOS zooms into the field */
        }
        button.btn {
          min-height: 40px;
          padding: 8px 14px;
        }
        button.small {
          min-height: 34px;
        }
        .sticky-save {
          bottom: calc(64px + env(safe-area-inset-bottom));
        }
        .toast {
          bottom: calc(80px + env(safe-area-inset-bottom));
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 14px;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        margin-right: 4px;
      }
      .tag.red {
        background: #fde8ea;
        color: var(--danger);
      }
      .tag.green {
        background: #e2f6ee;
        color: var(--ok);
      }
      .vip-box {
        margin-top: 12px;
        padding: 14px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(246, 196, 83, 0.18), rgba(240, 138, 192, 0.18));
        border: 1px solid rgba(240, 138, 192, 0.35);
      }
      .vip-box p {
        margin: 4px 0 10px;
      }
      .grant-line {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .grant-line input {
        margin-top: 3px;
      }
      .grant-line > span {
        display: flex;
        flex-direction: column;
      }
      .tag.vip {
        background: linear-gradient(90deg, #f6c453, #f08ac0);
        color: #3b1d00;
        font-weight: 700;
      }
      .tag.gray {
        background: var(--line);
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 20;
        max-width: 90vw;
      }
      .toast.err {
        background: var(--danger);
        color: #fff;
      }
      .login {
        max-width: 380px;
        margin: 12vh auto;
      }
      .login input {
        width: 100%;
        margin-bottom: 10px;
      }
      .q {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        margin-bottom: 10px;
        background: var(--panel);
      }
      .q.ad {
        border-left: 4px solid var(--warn);
      }
      .q.premium {
        border-left: 4px solid var(--accent);
      }
      .opt {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .opt input[type='text'] {
        flex: 1;
      }
      .ref {
        color: var(--muted);
        font-size: 12px;
        margin: 2px 0 4px;
      }
      .sticky-save {
        position: sticky;
        bottom: 0;
        background: var(--bg);
        padding: 10px 0;
        display: flex;
        gap: 10px;
        align-items: center;
        border-top: 1px solid var(--line);
      }
      .hidden {
        display: none !important;
      }
      label.inline {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin-right: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field span {
        font-size: 13px;
        color: var(--muted);
      }
      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

      // Public project values (the same ones the app ships with). Every admin action is
      // checked on the server: only accounts listed in private.admins can do anything.
      const SUPABASE_URL = 'https://mmljchdhmlcrrfctgvme.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_1NwUzGRqhedR_5_j4OVITw_RRr2D46n';
      const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, storageKey: 'vibecheck-admin' },
      });

      const LOCALES = ['tr', 'en', 'de', 'es', 'it', 'fr', 'ru'];
      const LOCALE_NAMES = {
        tr: 'Türkçe',
        en: 'English',
        de: 'Deutsch',
        es: 'Español',
        it: 'Italiano',
        fr: 'Français',
        ru: 'Русский',
      };
      const CATEGORY_NAMES = {
        personality: 'Kendini Keşfet (kişilik)',
        solo: 'Kendini Keşfet',
        friends: 'Friends',
        couples: 'Couple Match',
      };
      // Question dimensions: shown as the "map" in the app's detailed analysis.
      const DIMENSIONS = {
        couples: {
          communication: 'İletişim',
          daily_life: 'Günlük Yaşam',
          finance_career: 'Finans & Kariyer',
          social_boundaries: 'Sosyal Çevre',
          values_philosophy: 'Değerler',
        },
        friends: {
          social_fun: 'Eğlence & Planlar',
          loyalty_support: 'Sadakat',
          habits_quirks: 'Alışkanlıklar',
          communication_conflict: 'İletişim & Mizah',
          values_boundaries: 'Değerler',
        },
      };
      const TIER_NAMES = { base: 'Temel', ad: 'Reklamlı (+)', premium: 'Premium' };
      const ERRORS = {
        not_allowed: 'Bu hesabın yönetici yetkisi yok.',
        user_not_found: 'Kullanıcı bulunamadı.',
        invalid_config: 'Ayar değerleri geçersiz.',
        invalid_action: 'Bu işlem yapılamaz.',
        quiz_not_found: 'Quiz bulunamadı.',
        report_not_found: 'Şikayet bulunamadı.',
        invalid_pattern: 'Geçersiz kelime/kalıp.',
      };

      // ---------- tiny DOM helpers (text only: user content never becomes HTML) ----------
      function h(tag, props = {}, ...children) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props || {})) {
          if (v == null || v === false) continue;
          if (k === 'class') el.className = v;
          else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
          else if (k === 'value') el.value = v;
          else if (k === 'checked') el.checked = !!v;
          else el.setAttribute(k, v === true ? '' : v);
        }
        for (const c of children.flat())
          if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
        return el;
      }
      const $app = document.getElementById('app');
      const setMain = (...nodes) => {
        const list = nodes.flat().filter((n) => n != null && n !== false);
        // Views open with their own <h2> title; on computers it becomes the page heading.
        if (list[0]?.tagName === 'H2') list[0].classList.add('page-title-h');
        $main.replaceChildren(...list);
      };
      let refreshSide = () => {};
      let toastTimer;
      function toast(msg, isError = false) {
        document.querySelector('.toast')?.remove();
        const el = h('div', { class: 'toast' + (isError ? ' err' : '') }, msg);
        document.body.append(el);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.remove(), isError ? 6000 : 2500);
      }
      function errText(e) {
        const m = (e && (e.message || e.error_description)) || String(e);
        for (const [k, v] of Object.entries(ERRORS)) if (m.includes(k)) return v;
        if (m.startsWith('invalid_quiz'))
          return 'Quiz kaydedilemedi: ' + m.replace('invalid_quiz:', '').trim();
        return m;
      }
      async function rpc(name, args) {
        const { data, error } = await sb.rpc(name, args);
        if (error) throw error;
        return data;
      }
      const fmtDate = (d) =>
        d ? new Date(d).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
      const uuid = () => crypto.randomUUID();

      // ---------- auth ----------
      let me = null;
      async function start() {
        const { data } = await sb.auth.getSession();
        if (!data.session) return renderLogin();
        me = data.session.user;
        let isAdmin = false;
        try {
          isAdmin = await rpc('admin_is');
        } catch {
          /* fall through */
        }
        if (!isAdmin) return renderNotAdmin();
        renderShell();
      }

      function renderLogin(note) {
        const email = h('input', {
          type: 'email',
          placeholder: 'E-posta',
          autocomplete: 'username',
        });
        const pass = h('input', {
          type: 'password',
          placeholder: 'Şifre',
          autocomplete: 'current-password',
        });
        const go = async (signup) => {
          if (!email.value || pass.value.length < 10)
            return toast('E-posta ve en az 10 karakterlik şifre gir.', true);
          const { error } = signup

      const EST_KEY = 'vc.admin.earnings.v1';
      function loadEst() {
        const d = { fee: 15, rewarded: 8, interstitial: 4, banner: 0.5, tests: false, days: '30' };
        try {
          return { ...d, ...JSON.parse(localStorage.getItem(EST_KEY) || '{}') };

      function saveEst(e) {
        try {

      const usd = (n) =>

      async function viewEarnings() {
        const est = loadEst();
        const days = est.days === 'all' ? null : Number(est.days);
        const d = await rpc('admin_earnings', { p_days: days });
        const counts = (env) => env === 'production' || est.tests;
        const net = (gross) => gross * (1 - est.fee / 100);
        const adMoney = (kind, n) => (n / 1000) * (est[kind] ?? est.rewarded);

        // Sales per product (real only unless test purchases are switched on).
        const byProduct = {};
        let testCount = 0;
        for (const p of d.purchases) {
          if (p.environment !== 'production') testCount += p.count;
          if (!counts(p.environment)) continue;
          byProduct[p.product_id] = (byProduct[p.product_id] || 0) + p.count;
        }
        const productRows = Object.entries(byProduct)
          .map(([id, n]) => ({ id, n, gross: n * (PRICES_USD[id] || 0) }))
          .sort((a, b) => b.gross - a.gross);
        const sales = productRows.reduce((s, r) => s + r.n, 0);
        const gross = productRows.reduce((s, r) => s + r.gross, 0);

        const adRows = d.ads.map((a) => ({
          key: a.kind + ':' + (a.purpose || ''),
          kind: a.kind,
          n: a.count,
          today: a.today,
          money: adMoney(a.kind, a.count),
        }));
        const rewarded = adRows.filter((a) => a.kind === 'rewarded').reduce((s, a) => s + a.n, 0);
        const inter = adRows.filter((a) => a.kind === 'interstitial').reduce((s, a) => s + a.n, 0);
        const banners = adRows.filter((a) => a.kind === 'banner').reduce((s, a) => s + a.n, 0);
        const adsToday = adRows.reduce((s, a) => s + a.today, 0);
        const adEst = adRows.reduce((s, a) => s + a.money, 0);

        // Daily series: net sales + estimated ad money per Istanbul day.
        const series = {};
        const day = (k) => (series[k] ||= { sales: 0, ads: 0, n: 0, adN: 0 });
        for (const r of d.daily) {
          if (r.product_id) {
            if (!counts(r.environment)) continue;
            day(r.day).sales += net(r.count * (PRICES_USD[r.product_id] || 0));
            day(r.day).n += r.count;
          } else {
            day(r.day).ads += adMoney(r.ad_kind, r.count);
            day(r.day).adN += r.count;
          }
        }
        const dayKeys = [];
        if (days) {
          for (let i = days - 1; i >= 0; i--) {
            const t = new Date(Date.now() - i * 86400000);
            dayKeys.push(t.toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' }));

        } else dayKeys.push(...Object.keys(series).sort());

          'select',

        const maxDay = Math.max(

        const chart = h(

          } catch (e) {

        const grantsBox = h('div');

        setMain(
          h(
            'div',
            { class: 'panel' },

              h('button', { class: 'btn primary', onclick: search }, 'Ara'),

            h(
              'p',
              { class: 'muted' },

            'table',
            {},
            h(
              'thead',
              {},
              h(
                'tr',
                {},
                h('th', {}, 'Kullanıcı'),
                h('th', {}, 'Giriş'),
                h('th', {}, 'Durum'),
                h('th', {}, ''),

            ),
            h(
              'tbody',

              h('div', { class: 'muted' }, h('code', {}, u.id)),

            h(
              'td',
              {},
              h('div', {}, u.provider || '—'),
              h('div', { class: 'muted' }, 'Kayıt: ' + fmtDate(u.created_at)),
              h('div', { class: 'muted' }, 'Son giriş: ' + fmtDate(u.last_sign_in_at)),

            h(
              'td',
              {},
              u.is_admin ? h('span', { class: 'tag' }, 'yönetici') : null,
              u.banned
                ? h('span', { class: 'tag red', title: u.ban_reason || '' }, 'engelli')
                : null,
              u.reports_against
                ? h('span', { class: 'tag red' }, `${u.reports_against} şikayet`)
                : null,
              u.wallet_balance
                ? h('span', { class: 'tag green' }, `${u.wallet_balance} mesaj bakiyesi`)
                : null,
              u.match_balance

                : null,
              isVip(g) && !expired ? h('span', { class: 'tag vip' }, '⭐ VIP') : null,
              !isVip(g) && g?.unlimited_chat
                ? h('span', { class: 'tag green' }, 'sınırsız mesaj')
                : null,
              !isVip(g) && g?.free_premium
                ? h('span', { class: 'tag green' }, 'ücretsiz ek sorular')
                : null,
              !isVip(g) && g?.ad_free ? h('span', { class: 'tag green' }, 'reklamsız') : null,
              !isVip(g) && g?.unlimited_matches
                ? h('span', { class: 'tag green' }, 'sınırsız eşleşme')
                : null,
              expired ? h('span', { class: 'tag gray' }, 'süresi doldu') : null,
              g?.note ? h('div', { class: 'muted' }, 'Not: ' + g.note) : null,

              h(

                '⭐ Haklar / VIP',
              ),
              ' ',
              h(
                'button',
                {
                  class: 'btn small',
                  onclick: () => {
                    const raw = prompt(
                      `${u.nickname || u.email || 'Bu kullanıcı'} için mesaj bakiyesine eklenecek sayı (düşmek için eksi yaz). Şu an: ${u.wallet_balance || 0}`,
                      '25',

                    if (raw !== null && n)
                      act(

                        'Mesaj bakiyesi güncellendi',
                      );

                },
                'Mesaj ekle',
              ),
              ' ',
              h(
                'button',
                {
                  class: 'btn small',
                  onclick: () => {
                    const raw = prompt(
                      `${u.nickname || u.email || 'Bu kullanıcı'} için eklenecek eşleşme hakkı (düşmek için eksi yaz). Şu an: ${u.match_balance || 0}`,
                      '5',
                    );
                    const n = Math.trunc(Number(raw));
                    if (raw !== null && n)
                      act(
                        () => rpc('admin_match_wallet_add', { p_user: u.id, p_amount: n }),
                        fill,
                        'Eşleşme hakkı güncellendi',
                      );
                  },
                },
                'Eşleşme ekle',
              ),
              ' ',
              u.banned
                ? h(
                    'button',
                    {
                      class: 'btn small',
                      onclick: () =>
                        act(
                          () =>
                            rpc('admin_unban', { p_user: u.id }).then(() => ({
                              ...u,
                              banned: false,
                            })),
                          fill,
                          'Engel kaldırıldı',

                    },
                    'Engeli kaldır',
                  )
                : u.is_admin

                  : h(

                              'Engellendi',
                            );
                        },
                      },
                      'Engelle',
                    ),
            ),
          );
        };
        fill(u);
        return tr;
      }
      async function act(fn, fill, okMsg) {
        try {
          const u = await fn();
          if (u) fill(u);
          toast(okMsg);
          refreshSide().catch(() => {});
        } catch (e) {
          toast(errText(e), true);
        }
      }

      const isVip = (g) =>
        !!g && g.unlimited_chat && g.free_premium && g.ad_free && g.unlimited_matches;
      function openGrant(u, fill) {
        const g = u.grants || {};
        const name = u.nickname || u.email || 'Kullanıcı';
        const box = (checked) => h('input', { type: 'checkbox', checked: !!checked });
        const chat = box(g.unlimited_chat);
        const prem = box(g.free_premium);
        const adf = box(g.ad_free);
        const mat = box(g.unlimited_matches);
        const exp = h('input', {
          type: 'date',
          value: g.expires_at ? g.expires_at.slice(0, 10) : '',
        });
        const note = h('input', {
          type: 'text',
          placeholder: 'Not (örn. arkadaşım, test kullanıcısı)',
          value: g.note || '',
          style: 'width:100%',
        });
        const close = () => dlg.close();
        const save = async (msg) => {
          await act(
            () =>
              rpc('admin_grant_set', {
                p_user: u.id,
                p_unlimited_chat: chat.checked,
                p_free_premium: prem.checked,
                p_ad_free: adf.checked,
                p_unlimited_matches: mat.checked,
                p_expires_at: exp.value ? new Date(exp.value + 'T23:59:59').toISOString() : null,
                p_note: note.value || null,
              }),
            fill,
            msg,
          );
          close();
        };
        const vipFor = (days) => {
          chat.checked = prem.checked = adf.checked = mat.checked = true;
          exp.value = days
            ? new Date(Date.now() + days * 86400000).toLocaleDateString('en-CA')
            : '';
          save(days ? `VIP verildi (${days} gün)` : 'VIP verildi (süresiz)');
        };
        const line = (input, title, sub) =>
          h(
            'label',
            { class: 'grant-line' },
            input,
            h('span', {}, h('b', {}, title), h('span', { class: 'muted' }, sub)),
          );
        const dlg = h(
          'dialog',
          { class: 'sheet' },
          h(
            'div',
            { class: 'sheet-head' },
            h('div', {}, h('b', {}, name), h('div', { class: 'muted' }, 'Özel haklar')),
            h('button', { class: 'btn small', type: 'button', onclick: close }, 'Kapat'),
          ),
          h(
            'div',
            { class: 'vip-box' },
            h('b', {}, '⭐ VIP: her şey bedava'),
            h(
              'p',
              { class: 'muted' },
              'Sınırsız mesaj, ücretsiz ek sorular (+12 ve +50), reklamsız kullanım ve sınırsız eşleşme. Tek dokunuşla verilir.',
            ),
            h(
              'div',
              { class: 'row' },
              [
                [7, '7 gün'],
                [30, '30 gün'],
                [365, '1 yıl'],
                [0, 'Süresiz'],
              ].map(([d, l]) =>
                h(
                  'button',
                  { class: 'btn primary small', type: 'button', onclick: () => vipFor(d) },
                  l,
                ),
              ),
            ),
          ),
          h('h3', { style: 'margin-top:16px' }, 'Ya da tek tek seç'),
          line(chat, 'Sınırsız mesaj', 'Couple Match sohbetinde bakiye düşmez.'),
          line(
            prem,
            'Ücretsiz ek sorular',
            'Reklamlı +12 ve premium +50 paketleri satın almadan açılır.',
          ),
          line(adf, 'Reklamsız', 'Tam ekran ve banner reklam görmez.'),
          line(mat, 'Sınırsız eşleşme', 'Eşleşme sınırı açıkken bile günlük sınıra takılmaz.'),
          h(
            'div',
            { class: 'row', style: 'margin:12px 0' },
            h('span', { class: 'muted' }, 'Bitiş tarihi (boş = süresiz):'),
            exp,
          ),
          note,
          h(
            'p',
            { class: 'muted' },
            'Uygulama değişikliği birkaç dakika içinde görür. Ek sorular, iki kişi aynı paketi seçtiğinde haklardan biri bu kullanıcıdaysa kendiliğinden açılır.',
          ),
          h(
            'div',
            { class: 'row' },
            h(
              'button',
              { class: 'btn primary', type: 'button', onclick: () => save('Haklar kaydedildi') },
              'Kaydet',
            ),
            Object.keys(u.grants || {}).length
              ? h(
                  'button',
                  {
                    class: 'btn danger',
                    type: 'button',
                    onclick: () => {
                      chat.checked = prem.checked = adf.checked = mat.checked = false;
                      save('Tüm haklar kaldırıldı');
                    },
                  },
                  'Tüm hakları kaldır',
                )
              : null,
          ),
        );
        dlg.addEventListener('close', () => dlg.remove());
        dlg.addEventListener('click', (e) => e.target === dlg && close());
        document.body.append(dlg);
        dlg.showModal();
      }

        const addPat = async () => {
          const v = patIn.value.trim();
          if (!v) return;
          // Words and phrases become a whole-word match (same rules as scripts/build_moderation.py);
          // anything with regex syntax like \m or [ ] is sent as written.
          const pattern = /\\[mM]|\[|\(\?/.test(v) ? v : toPattern(v);
          try {
            await rpc('admin_pattern_add', { p_pattern: pattern, p_action: patAction.value });

      };
      // Whole word or phrase, any case, Turkish i/ı/İ/I alike, any spacing, ' or ’.
      // Keep in step with to_pattern() in scripts/build_moderation.py.
      const toPattern = (entry) => {
        const e = entry.trim();
        let body = '';
        for (const ch of e.toLocaleLowerCase('tr')) {
          if (ch === 'i' || ch === 'ı') body += '[iıİI]';
          else if (ch === "'" || ch === '’') body += "['’]";
          else if (/\s/.test(ch)) body += body.endsWith('\\s+') ? '' : '\\s+';
          else if ('\\.^$|?*+()[]{}'.includes(ch)) body += '\\' + ch;
          else body += ch;
        }
        const word = (c) => /[\p{L}\p{N}]/u.test(c);
        const start = word(e[0]) ? '\\m' : '(?<![[:alnum:]_])';
        const end = word(e[e.length - 1]) ? '\\M' : '(?![[:alnum:]_])';
        return start + body + end;
      };

      async function openEditor(id) {
        const quiz = id
          ? await rpc('admin_quiz_get', { p_quiz: id })
          : {
              id: uuid(),
              slug: '',
              category: 'friends',
              status: 'draft',
              sort_order: 0,
              play_mode: 'prediction',
              translations: {},
              outcomes: [],
              questions: [],
            };
        dirty = false;
        renderEditor(quiz, !id);
      }

      function renderEditor(quiz, isNew) {
        const markDirty = () => {
          dirty = true;
        };
        const scored = () => quiz.category === 'personality' || quiz.category === 'solo';
        const tiered = () => quiz.category === 'couples';
        const tr = (obj, key = editLocale) => (obj || {})[key] || '';

        const localeSel = h(
          'select',
          {
            onchange: (e) => {
              editLocale = e.target.value;
              renderEditor(quiz, isNew);
            },
          },
          LOCALES.map((l) =>
            h('option', { value: l, selected: l === editLocale ? true : null }, LOCALE_NAMES[l]),
          ),
        );
        const refNote = (obj) =>
          editLocale !== 'en' && obj?.en
            ? h(
                'div',
                { class: 'ref' },
                'EN: ' + (typeof obj.en === 'string' ? obj.en : obj.en.title),
              )
            : null;

        // --- meta ---
        const slug = h('input', {
          type: 'text',
          value: quiz.slug,
          placeholder: 'ornek-quiz-adi',
          oninput: (e) => {
            quiz.slug = e.target.value;
            markDirty();
          },
        });
        const cat = h(
          'select',
          {
            onchange: (e) => {
              quiz.category = e.target.value;
              markDirty();
              renderEditor(quiz, isNew);
            },
          },
          Object.entries(CATEGORY_NAMES).map(([k, v]) =>
            h('option', { value: k, selected: k === quiz.category ? true : null }, v),
          ),
        );
        const mode = h(
          'select',
          {
            onchange: (e) => {
              quiz.play_mode = e.target.value;
              markDirty();
            },
          },
          h(
            'option',
            { value: 'match', selected: quiz.play_mode === 'match' ? true : null },
            'Eşleşme (aynı cevap = uyum)',
          ),
          h(
            'option',
            { value: 'prediction', selected: quiz.play_mode === 'prediction' ? true : null },
            'Tahmin (önce kendin, sonra arkadaşını tahmin et)',
          ),
        );
        const sort = h('input', {
          type: 'number',
          value: quiz.sort_order,
          style: 'width:80px',
          oninput: (e) => {
            quiz.sort_order = Number(e.target.value) || 0;
            markDirty();
          },
        });
        const status = h(
          'select',
          {
            onchange: (e) => {
              quiz.status = e.target.value;
              markDirty();
            },
          },
          ['draft', 'published', 'archived'].map((s) =>
            h(
              'option',
              { value: s, selected: s === quiz.status ? true : null },
              { draft: 'Taslak', published: 'Yayında', archived: 'Arşiv' }[s],
            ),
          ),
        );
        const title = h('input', {
          type: 'text',
          value: tr(quiz.translations)?.title || '',
          style: 'width:100%',
          oninput: (e) => {
            quiz.translations[editLocale] = {
              ...(quiz.translations[editLocale] || {}),
              title: e.target.value,
            };
            markDirty();
          },
        });
        const desc = h(
          'textarea',
          {
            oninput: (e) => {
              quiz.translations[editLocale] = {
                ...(quiz.translations[editLocale] || {}),
                description: e.target.value,
              };
              markDirty();
            },
          },
          tr(quiz.translations)?.description || '',
        );

        // --- outcomes (scored quizzes) ---
        const outcomesPanel = !scored()
          ? null
          : h(
              'div',
              { class: 'panel' },
              h('h3', {}, 'Sonuçlar'),
              h(
                'p',
                { class: 'muted' },
                'Her şık bir sonuca bağlanır; en çok seçilen sonuç kişinin sonucu olur.',
              ),
              quiz.outcomes.map((o, i) =>
                h(
                  'div',
                  { class: 'q' },
                  h(
                    'div',
                    { class: 'row' },
                    h('b', {}, `Sonuç ${i + 1}`),
                    h(
                      'button',
                      {
                        class: 'btn small danger',
                        onclick: () => {
                          if (confirm('Bu sonuç silinsin mi? Ona bağlı şıklar boşa düşer.')) {
                            quiz.outcomes.splice(i, 1);
                            markDirty();
                            renderEditor(quiz, isNew);
                          }
                        },
                      },
                      'Sil',
                    ),
                  ),
                  h('input', {
                    type: 'text',
                    placeholder: 'Sonuç adı',
                    value: tr(o.translations)?.title || '',
                    style: 'width:100%;margin-top:6px',
                    oninput: (e) => {
                      o.translations[editLocale] = {
                        ...(o.translations[editLocale] || {}),
                        title: e.target.value,
                      };
                      markDirty();
                    },
                  }),
                  refNote(o.translations),
                  h(
                    'textarea',
                    {
                      placeholder: 'Açıklama',
                      oninput: (e) => {
                        o.translations[editLocale] = {
                          ...(o.translations[editLocale] || {}),
                          description: e.target.value,
                        };
                        markDirty();
                      },
                    },
                    tr(o.translations)?.description || '',
                  ),
                ),
              ),
              h(
                'button',
                {
                  class: 'btn',
                  onclick: () => {
                    quiz.outcomes.push({ id: uuid(), translations: {} });
                    markDirty();
                    renderEditor(quiz, isNew);
                  },
                },
                '+ Sonuç ekle',
              ),
            );

        // --- questions ---
        const outcomeName = (o, i) =>
          tr(o.translations)?.title ||
          o.translations?.en?.title ||
          o.translations?.tr?.title ||
          `Sonuç ${i + 1}`;
        const moveQ = (i, d) => {
          const j = i + d;
          if (j < 0 || j >= quiz.questions.length) return;
          [quiz.questions[i], quiz.questions[j]] = [quiz.questions[j], quiz.questions[i]];
          markDirty();
          renderEditor(quiz, isNew);
        };
        const questionCards = quiz.questions.map((qn, i) => {
          const filled = LOCALES.filter((l) => qn.translations?.[l]).length;
          return h(
            'div',
            { class: 'q ' + (qn.tier || 'base') },
            h(
              'div',
              { class: 'row', style: 'justify-content:space-between' },
              h(
                'div',
                { class: 'row' },
                h('b', {}, `Soru ${i + 1}`),
                tiered()
                  ? h(
                      'select',
                      {
                        onchange: (e) => {
                          qn.tier = e.target.value;
                          markDirty();
                          renderEditor(quiz, isNew);
                        },
                      },
                      Object.entries(TIER_NAMES).map(([k, v]) =>
                        h(
                          'option',
                          { value: k, selected: k === (qn.tier || 'base') ? true : null },
                          v,
                        ),
                      ),
                    )
                  : null,
                DIMENSIONS[quiz.category]
                  ? h(
                      'select',
                      {
                        title: 'Analiz boyutu',
                        onchange: (e) => {
                          qn.dimension = e.target.value || null;
                          markDirty();
                        },
                      },
                      [
                        h('option', { value: '' }, 'Boyut yok'),
                        ...Object.entries(DIMENSIONS[quiz.category]).map(([k, v]) =>
                          h('option', { value: k, selected: k === qn.dimension ? true : null }, v),
                        ),
                      ],
                    )
                  : null,
                h('span', { class: 'tag ' + (filled === 7 ? 'green' : 'gray') }, `${filled}/7 dil`),
              ),
              h(
                'div',
                { class: 'row' },
                h(
                  'button',
                  { class: 'btn small', title: 'Yukarı', onclick: () => moveQ(i, -1) },
                  '↑',
                ),
                h(
                  'button',
                  { class: 'btn small', title: 'Aşağı', onclick: () => moveQ(i, 1) },
                  '↓',
                ),
                h(
                  'button',
                  {
                    class: 'btn small danger',
                    onclick: () => {
                      if (confirm('Soru silinsin mi?')) {
                        quiz.questions.splice(i, 1);
                        markDirty();
                        renderEditor(quiz, isNew);
                      }
                    },
                  },
                  'Sil',
                ),
              ),
            ),
            h(
              'textarea',
              {
                placeholder: `Soru metni (${LOCALE_NAMES[editLocale]})`,
                style: 'margin-top:6px',
                oninput: (e) => {
                  qn.translations[editLocale] = e.target.value;
                  markDirty();
                },
              },
              tr(qn.translations),
            ),
            refNote(qn.translations),
            qn.options.map((op, k) =>
              h(
                'div',
                { class: 'opt' },
                h('span', { class: 'muted' }, String.fromCharCode(65 + k)),
                h('input', {
                  type: 'text',
                  placeholder: 'Şık',
                  value: tr(op.translations),
                  oninput: (e) => {
                    op.translations[editLocale] = e.target.value;
                    markDirty();
                  },
                }),
                scored()
                  ? h(
                      'select',
                      {
                        onchange: (e) => {
                          op.outcome_id = e.target.value || null;
                          markDirty();
                        },
                      },
                      h('option', { value: '' }, '— sonuç seç —'),
                      quiz.outcomes.map((o, oi) =>
                        h(
                          'option',
                          { value: o.id, selected: o.id === op.outcome_id ? true : null },
                          outcomeName(o, oi),
                        ),
                      ),
                    )
                  : null,
                h(
                  'button',
                  {
                    class: 'btn small',
                    title: 'Şıkkı sil',
                    disabled: qn.options.length <= 2 ? true : null,
                    onclick: () => {
                      qn.options.splice(k, 1);
                      markDirty();
                      renderEditor(quiz, isNew);
                    },
                  },
                  '×',
                ),
              ),
            ),
            h(
              'button',
              {
                class: 'btn small',
                style: 'margin-top:8px',
                onclick: () => {
                  qn.options.push({ id: uuid(), outcome_id: null, translations: {} });
                  markDirty();
                  renderEditor(quiz, isNew);
                },
              },
              '+ Şık',
            ),
          );
        });
        const addQuestion = () => {
          // New questions start with the same answer choices as the first question (e.g. Always / Depends / Never).
          const tpl = quiz.questions[0]?.options;
          const options = tpl
            ? tpl.map((o) => ({
                id: uuid(),
                outcome_id: scored() ? o.outcome_id : null,
                translations: { ...o.translations },
              }))
            : [
                { id: uuid(), outcome_id: null, translations: {} },
                { id: uuid(), outcome_id: null, translations: {} },
              ];
          const tier = tiered() ? quiz.questions.at(-1)?.tier || 'base' : 'base';
          const dimension = quiz.questions.at(-1)?.dimension || null;
          quiz.questions.push({ id: uuid(), tier, dimension, translations: {}, options });
          markDirty();
          renderEditor(quiz, isNew);
          setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
        };

        const missing = LOCALES.map((l) => [
          l,
          quiz.questions.filter((q) => !q.translations?.[l]).length,
        ]).filter(([, n]) => n);
        const counts = ['base', 'ad', 'premium']
          .map((t) => [t, quiz.questions.filter((q) => (q.tier || 'base') === t).length])
          .filter(([, n]) => n);

        const saveBtn = h(
          'button',
          {
            class: 'btn primary',
            onclick: async () => {
              // Questions are saved grouped by tier (base, then ad, then premium) in this order.
              const order = { base: 0, ad: 1, premium: 2 };
              const payload = {
                ...quiz,
                questions: [...quiz.questions].sort(
                  (a, b) => order[a.tier || 'base'] - order[b.tier || 'base'],
                ),
              };
              saveBtn.disabled = true;
              try {
                const saved = await rpc('admin_quiz_save', { p: payload });
                dirty = false;
                toast('Kaydedildi');
                renderEditor(saved, false);
              } catch (e) {
                toast(errText(e), true);
                saveBtn.disabled = false;
              }
            },
          },
          'Kaydet',
        );

        setMain(
          h(
            'div',
            { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' },
            h('button', { class: 'btn', onclick: () => show('content') }, '← Quiz listesi'),
            h('div', { class: 'row' }, h('span', { class: 'muted' }, 'Düzenlenen dil:'), localeSel),
          ),
          h(
            'div',
            { class: 'panel' },
            h(
              'h2',
              {},
              isNew
                ? 'Yeni quiz'
                : quiz.translations.tr?.title || quiz.translations.en?.title || quiz.slug,
            ),
            h(
              'div',
              { class: 'row' },
              h('label', { class: 'field' }, h('span', {}, 'Bölüm'), cat),
              h(
                'label',
                { class: 'field' },
                h('span', {}, 'Kısa ad (URL, küçük harf ve tire)'),
                slug,
              ),
              quiz.category === 'friends' || quiz.category === 'couples'
                ? h('label', { class: 'field' }, h('span', {}, 'Oyun türü'), mode)
                : null,
              h('label', { class: 'field' }, h('span', {}, 'Sıra'), sort),
              h('label', { class: 'field' }, h('span', {}, 'Durum'), status),
            ),
            h(
              'label',
              { class: 'field', style: 'margin-top:12px' },
              h('span', {}, `Başlık (${LOCALE_NAMES[editLocale]})`),
              title,
            ),
            refNote(quiz.translations),
            h(
              'label',
              { class: 'field', style: 'margin-top:8px' },
              h('span', {}, `Açıklama (${LOCALE_NAMES[editLocale]})`),
              desc,
            ),
            tiered()
              ? h(
                  'p',
                  { class: 'muted' },
                  'Couple Match: Temel sorular herkese açık; Reklamlı ve Premium sorular ek paketlerdir. Sıralama paket içinde geçerlidir.',
                )
              : null,
          ),
          outcomesPanel,
          h(
            'div',
            {},
            h('h3', {}, `Sorular (${quiz.questions.length})`),
            questionCards,
            h('button', { class: 'btn', onclick: addQuestion }, '+ Soru ekle'),
          ),
          h(
            'div',
            { class: 'sticky-save' },
            saveBtn,
            h(
              'span',
              { class: 'muted' },
              counts.map(([t, n]) => `${TIER_NAMES[t]}: ${n}`).join(' · '),
            ),
            missing.length
              ? h(
                  'span',
                  { class: 'muted' },
                  ' · Eksik çeviri: ' +
                    missing.map(([l, n]) => `${l.toUpperCase()} ${n}`).join(', '),
                )
              : null,
            quiz.status === 'published'
              ? h('span', { class: 'tag green' }, 'Kaydedince hemen yayına girer')
              : null,
          ),
        );
      }

      const VIEWS = {
        overview: viewOverview,
        earnings: viewEarnings,
        users: viewUsers,
        reports: viewReports,
        content: viewContent,
        settings: viewSettings,
      };
      sb.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') renderLogin();
      });
      start();
    </script>
  </body>
</html>
