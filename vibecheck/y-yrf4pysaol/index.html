<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VibeCheck Yönetim</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VC Yönetim" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f6f5fb;
        --panel: #fff;
        --ink: #1d1b2e;
        --muted: #6b6880;
        --line: #e4e1ef;
        --accent: #6c4cf5;
        --accent-soft: #efeafe;
        --danger: #d33c4a;
        --ok: #1f9d6b;
        --warn: #c98a12;
        --radius: 10px;
        font-size: 15px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #14131c;
          --panel: #1d1b29;
          --ink: #ecebf5;
          --muted: #a09db5;
          --line: #312e44;
          --accent: #9d86ff;
          --accent-soft: #2a2442;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.45;
      }
      /* ---------- shell: sidebar on computers, tab bar on phones ---------- */
      .app {
        min-height: 100vh;
      }
      .side {
        display: none;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: saturate(1.4) blur(14px);
        -webkit-backdrop-filter: saturate(1.4) blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .topbar h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar .brand-mini {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      .ico {
        display: inline-flex;
        width: 22px;
        height: 22px;
        flex: none;
      }
      .ico svg {
        width: 100%;
        height: 100%;
      }
      .navbtn {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .navbtn.on {
        color: var(--accent);
      }
      .badge {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 99px;
        background: var(--danger);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .badge:empty {
        display: none;
      }
      .tabbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: saturate(1.4) blur(16px);
        -webkit-backdrop-filter: saturate(1.4) blur(16px);
        border-top: 1px solid var(--line);
      }
      .tabbar .navbtn {
        flex-direction: column;
        gap: 2px;
        padding: 4px 0;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        justify-content: center;
        min-height: 48px;
      }
      .tabbar .badge {
        position: absolute;
        top: 0;
        left: calc(50% + 6px);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
      }
      .page-title {
        display: none;
      }
      main > h2.page-title-h {
        display: none;
      }
      .more-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 12px;
      }
      .more-item {
        padding: 14px 10px;
        border-radius: 12px;
        color: var(--ink) !important;
        font-size: 16px;
      }
      .more-item:active {
        background: var(--accent-soft);
      }
      .more-item.danger {
        color: var(--danger) !important;
      }
      @media (prefers-color-scheme: dark) {
        .tag.red {
          background: rgba(211, 60, 74, 0.18);
        }
        .tag.green {
          background: rgba(31, 157, 107, 0.18);
        }
      }
      @media (min-width: 900px) {
        .app {
          display: grid;
          grid-template-columns: 248px 1fr;
        }
        .side {
          display: flex;
          flex-direction: column;
          position: sticky;
          top: 0;
          height: 100vh;
          padding: 20px 14px;
          background: var(--panel);
          border-right: 1px solid var(--line);
        }
        .side .brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 8px 18px;
          font-weight: 700;
          font-size: 16px;
        }
        .side .brand img {
          width: 32px;
          height: 32px;
          border-radius: 9px;
        }
        .side nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .side .navbtn {
          padding: 10px 12px;
          border-radius: 10px;
          font-weight: 500;
        }
        .side .navbtn:hover {
          background: var(--bg);
          color: var(--ink);
        }
        .side .navbtn.on {
          background: var(--accent-soft);
          color: var(--accent);
          font-weight: 600;
        }
        .side .navbtn .badge {
          margin-left: auto;
        }
        .side .foot {
          margin-top: auto;
          padding: 12px 8px 0;
          border-top: 1px solid var(--line);
          font-size: 13px;
          color: var(--muted);
          display: flex;
          flex-direction: column;
          gap: 8px;
          overflow-wrap: anywhere;
        }
        .topbar,
        .tabbar {
          display: none;
        }
        main {
          padding: 28px 32px 48px;
        }
        main > h2.page-title-h {
          display: block;
          font-size: 24px;
          margin: 0 0 18px;
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(20, 16, 40, 0.04);
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 1px 2px rgba(20, 16, 40, 0.04);
      }
      .stat b {
        display: block;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
      }
      textarea {
        width: 100%;
        resize: vertical;
        min-height: 54px;
      }
      input[type='checkbox'] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
      }
      button.btn {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button.btn:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--danger);
      }
      button.small {
        padding: 3px 8px;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      /* Phones: wide tables scroll sideways instead of pushing buttons off screen. */
      .earn-chart {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 160px;
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      .earn-col {
        flex: 1;
        min-width: 3px;
        height: 100%;
        display: flex;
        flex-direction: column-reverse;
        cursor: default;
      }
      .earn-col:hover {
        background: var(--accent-soft);
      }
      .earn-bar.sales,
      .earn-key.sales {
        background: var(--accent);
      }
      .earn-bar.ads,
      .earn-key.ads {
        background: var(--ok);
      }
      .earn-key {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        vertical-align: middle;
      }
      .stat.tap {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        padding-right: 28px;
        -webkit-tap-highlight-color: transparent;
      }
      .stat.tap:hover,
      .stat.tap:focus-visible {
        border-color: var(--accent);
      }
      .stat.tap:active {
        background: var(--accent-soft);
      }
      .stat.tap i {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-style: normal;
        font-size: 22px;
        color: var(--muted);
      }
      dialog.sheet {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--ink);
        width: min(560px, 94vw);
        max-height: 85vh;
        padding: 16px 18px 20px;
        overflow-y: auto;
      }
      dialog.sheet::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .sheet-num {
        font-size: 28px;
      }
      .earn-chart.small {
        height: 90px;
      }
      .chart-max {
        font-size: 12px;
        text-align: right;
        margin-bottom: 4px;
      }
      .chart-ends {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 4px;
      }
      ul.list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      ul.list li > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .field {
        min-width: 0;
        max-width: 100%;
      }
      .field input,
      .field textarea,
      .field select {
        max-width: 100%;
        box-sizing: border-box;
      }
      @media (max-width: 700px) {
        dialog.sheet {
          width: 100vw;
          max-width: 100vw;
          margin: auto 0 0;
          border-radius: 16px 16px 0 0;
          max-height: 88vh;
          padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        .row > .field {
          flex: 1 1 100%;
        }
      }
      textarea.missing,
      input.missing {
        border-color: var(--danger) !important;
        background: rgba(211, 60, 74, 0.06);
      }
      .bad-text {
        color: var(--danger);
      }
      .bulk-preview {
        max-height: 40vh;
        overflow-y: auto;
        margin-top: 10px;
      }
      .bulk-opts {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }
      .bulk-opt {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .bulk-opt select {
        max-width: 60%;
      }
      select.missing {
        border-color: var(--danger, #d33) !important;
      }
      .bulk-preview ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      /* ---------- round 2: KPIs, alerts, segments, detail sheet ---------- */
      .grid + .panel,
      .kpis + .panel {
        margin-top: 16px;
      }
      .section-title {
        margin: 22px 0 10px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
      }
      .kpi {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px 12px;
        box-shadow: 0 1px 2px rgba(20, 16, 40, 0.04);
      }
      .kpi.tap {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .kpi.tap:hover {
        border-color: var(--accent);
      }
      .kpi.tap:active {
        background: var(--accent-soft);
      }
      .kpi-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }
      .kpi-num {
        font-size: 30px;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .kpi-delta {
        font-size: 12px;
        color: var(--muted);
      }
      .kpi-delta.up {
        color: var(--ok);
      }
      .kpi-delta.down {
        color: var(--danger);
      }
      .kpi-foot {
        font-size: 12px;
        color: var(--muted);
      }
      .spark {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 30px;
        margin: 8px 0 4px;
      }
      .spark i {
        flex: 1;
        background: var(--accent-soft);
        border-radius: 2px;
      }
      .spark i.now {
        background: var(--accent);
      }
      .alerts {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 4px;
      }
      .alert {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--panel);
        font-size: 14px;
      }
      .alert.ok {
        border-color: rgba(31, 157, 107, 0.35);
        background: rgba(31, 157, 107, 0.08);
      }
      .alert.warn {
        border-color: rgba(230, 160, 40, 0.45);
        background: rgba(230, 160, 40, 0.1);
      }
      .alert.bad {
        border-color: rgba(211, 60, 74, 0.45);
        background: rgba(211, 60, 74, 0.1);
      }
      .alert.info {
        border-color: rgba(108, 92, 231, 0.35);
        background: var(--accent-soft);
        margin-bottom: 12px;
      }
      .alert .btn {
        flex: none;
      }
      .seg {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        margin-bottom: 14px;
      }
      .seg button {
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 9px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--accent);
        color: #fff;
      }
      details.help {
        margin: 6px 0 10px;
      }
      details.help summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
      }
      details.help p {
        margin: 6px 0 0;
      }
      dialog.sheet.wide {
        width: min(760px, 96vw);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 6px;
      }
      dl.facts {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 0;
        font-size: 14px;
      }
      dl.facts dt {
        color: var(--muted);
      }
      dl.facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .mini-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
      }
      .mini-grid > div {
        display: flex;
        flex-direction: column;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .mini-grid b {
        font-size: 20px;
      }
      .mini-grid span {
        font-size: 12px;
        color: var(--muted);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      dialog.sheet h3 {
        margin: 18px 0 8px;
        font-size: 15px;
      }
      @media (max-width: 700px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .kpi {
          padding: 12px;
        }
        .kpi-num {
          font-size: 26px;
        }
        .seg {
          display: flex;
          overflow-x: auto;
          flex-wrap: nowrap;
        }
        .seg button {
          white-space: nowrap;
        }
        .alert {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      /* Phones: every table row becomes a card; each cell shows its column name. */
      @media (max-width: 700px) {
        table.auto thead {
          display: none;
        }
        table.auto,
        table.auto tbody,
        table.auto tr,
        table.auto td {
          display: block;
          width: 100%;
        }
        table.auto tr {
          border: 1px solid var(--line);
          border-radius: 12px;
          padding: 10px 12px;
          margin-bottom: 10px;
          background: var(--panel);
        }
        .panel table.auto tr {
          background: var(--bg);
        }
        table.auto td {
          border: 0 !important;
          padding: 3px 0 !important;
          white-space: normal !important;
        }
        table.auto td[data-label]::before {
          content: attr(data-label);
          display: block;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--muted);
        }
        td .btn,
        td button {
          margin: 4px 4px 0 0;
        }
        input,
        select,
        textarea {
          font-size: 16px; /* below 16px iOS zooms into the field */
        }
        button.btn {
          min-height: 40px;
          padding: 8px 14px;
        }
        button.small {
          min-height: 34px;
        }
        .sticky-save {
          bottom: calc(64px + env(safe-area-inset-bottom));
        }
        .toast {
          bottom: calc(80px + env(safe-area-inset-bottom));
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      th,
      td {
        text-align: left;
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 14px;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        margin-right: 4px;
      }
      .tag.red {
        background: #fde8ea;
        color: var(--danger);
      }
      .tag.green {
        background: #e2f6ee;
        color: var(--ok);
      }
      .vip-box {
        margin-top: 12px;
        padding: 14px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(246, 196, 83, 0.18), rgba(240, 138, 192, 0.18));
        border: 1px solid rgba(240, 138, 192, 0.35);
      }
      .vip-box p {
        margin: 4px 0 10px;
      }
      .grant-line {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .grant-line input {
        margin-top: 3px;
      }
      .grant-line > span {
        display: flex;
        flex-direction: column;
      }
      .tag.vip {
        background: linear-gradient(90deg, #f6c453, #f08ac0);
        color: #3b1d00;
        font-weight: 700;
      }
      .tag.gray {
        background: var(--line);
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 20;

      function kpiCard([key, label, statKey, tab], series) {
        const v = series || [];
        const today = v[v.length - 1] || 0;

        const diff = today - yesterday;
        const tap = tab
          ? () => show(tab)
          : statKey
            ? () => openStat(statKey, label + ' (24 saat)', today)
            : null;
        return h(
          tap ? 'button' : 'div',
          { class: 'kpi' + (tap ? ' tap' : ''), type: tap ? 'button' : null, onclick: tap },
          h('span', { class: 'kpi-label' }, label),
          h('b', { class: 'kpi-num' }, today.toLocaleString('tr-TR')),
          h(
            'span',
            { class: 'kpi-delta ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '') },
            diff === 0 ? 'dünle aynı' : `${diff > 0 ? '▲ +' : '▼ '}${diff} düne göre`,

      function auditSummary(e) {
        const o = e.detail?.old || {};
        const n = e.detail?.new || {};
        if (e.action.startsWith('app_config')) {
          const a = o.config_value || {};
          const b = n.config_value || {};
          const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(
            (k) => JSON.stringify(a[k]) !== JSON.stringify(b[k]),
          );
          return keys
            .map((k) => `${k}: ${JSON.stringify(a[k]) ?? '—'} → ${JSON.stringify(b[k]) ?? '—'}`)
            .join(' · ');
        }
        if (e.action.includes('wallets')) return `${o.balance ?? 0} → ${n.balance ?? 0}`;
        if (e.action.startsWith('user_grants') && n.user_id)
          return (
            [
              n.unlimited_chat && 'sınırsız mesaj',
              n.free_premium && 'ek sorular',
              n.ad_free && 'reklamsız',
              n.unlimited_matches && 'sınırsız eşleşme',
            ]
              .filter(Boolean)
              .join(', ') + (n.expires_at ? ` · bitiş ${fmtDate(n.expires_at)}` : ' · süresiz')
          );
        if (e.action.startsWith('match_reports')) return `${o.status} → ${n.status}`;
        if (e.action.startsWith('chat_bans')) return n.reason || o.reason || '';
        if (e.action.startsWith('quizzes'))

      // ---------- user detail ----------
      const STATUS_TR = {

                    'span',
                    { class: 'tag red' },
                    'engelli' + (u.ban_reason ? ': ' + u.ban_reason : ''),

              isVip(g)

      // ---------- earnings ----------
      // Store prices (USD) as set in App Store Connect; money here is an estimate.
      const PRICES_USD = {
        'vibecheck.messages.25': 0.99,
        'vibecheck.messages.50': 1.49,
        'vibecheck.messages.100': 2.49,
        'vibecheck.couple.deep50': 1.99,
        'vibecheck.matches.10': 3.99,

        'vibecheck.matches.75': 14.99,
      };
      const EARN_LABELS = {
        'vibecheck.messages.25': '25 mesaj paketi',
        'vibecheck.messages.50': '50 mesaj paketi',
        'vibecheck.messages.100': '100 mesaj paketi',
        'vibecheck.couple.deep50': 'Derin test (+50 soru)',
        'vibecheck.chat.unlimited': 'Sınırsız sohbet (eski)',
        'vibecheck.matches.10': '10 eşleşme paketi',
        'vibecheck.matches.25': '25 eşleşme paketi',
        'vibecheck.matches.75': '75 eşleşme paketi',
      };
      const AD_KIND_LABELS = {
        'rewarded:tier': 'Ödüllü · ek sorular (+12)',
        'rewarded:messages': 'Ödüllü · mesaj (+3)',
        'rewarded:match': 'Ödüllü · eşleşme (+1)',
        'interstitial:': 'Tam ekran (geçiş) reklamı',
        'banner:': 'Banner (sonuç ekranı)',
      };
      const EST_KEY = 'vc.admin.earnings.v1';
      function loadEst() {
        const d = { fee: 15, rewarded: 8, interstitial: 4, banner: 0.5, tests: false, days: '30' };
        try {
          return { ...d, ...JSON.parse(localStorage.getItem(EST_KEY) || '{}') };
        } catch {
          return d;
        }
      }
      function saveEst(e) {
        try {
          localStorage.setItem(EST_KEY, JSON.stringify(e));
        } catch {}
      }
      const usd = (n) =>
        '$' +
        (Math.round(n * 100) / 100).toLocaleString('tr-TR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });

      const fmtDay = (k) =>
        new Date(k + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
      async function viewEarnings() {
        const est = loadEst();
        const days = est.days === 'all' ? null : Number(est.days);
        const d = await rpc('admin_earnings', { p_days: days });
        const counts = (env) => env === 'production' || est.tests;
        const net = (gross) => gross * (1 - est.fee / 100);
        const adMoney = (kind, n) => (n / 1000) * (est[kind] ?? est.rewarded);

        // Sales per product (real only unless test purchases are switched on).
        const byProduct = {};
        let testCount = 0;
        for (const p of d.purchases) {
          if (p.environment !== 'production') testCount += p.count;
          if (!counts(p.environment)) continue;
          byProduct[p.product_id] = (byProduct[p.product_id] || 0) + p.count;
        }
        const productRows = Object.entries(byProduct)
          .map(([id, n]) => ({ id, n, gross: n * (PRICES_USD[id] || 0) }))
          .sort((a, b) => b.gross - a.gross);
        const sales = productRows.reduce((s, r) => s + r.n, 0);
        const gross = productRows.reduce((s, r) => s + r.gross, 0);

        const adRows = d.ads.map((a) => ({
          key: a.kind + ':' + (a.purpose || ''),
          kind: a.kind,
          n: a.count,
          today: a.today,
          money: adMoney(a.kind, a.count),
        }));
        const rewarded = adRows.filter((a) => a.kind === 'rewarded').reduce((s, a) => s + a.n, 0);
        const inter = adRows.filter((a) => a.kind === 'interstitial').reduce((s, a) => s + a.n, 0);
        const banners = adRows.filter((a) => a.kind === 'banner').reduce((s, a) => s + a.n, 0);
        const adsToday = adRows.reduce((s, a) => s + a.today, 0);
        const adEst = adRows.reduce((s, a) => s + a.money, 0);

        // Daily series: net sales + estimated ad money per Istanbul day.
        const series = {};
        const day = (k) => (series[k] ||= { sales: 0, ads: 0, n: 0, adN: 0 });
        for (const r of d.daily) {
          if (r.product_id) {
            if (!counts(r.environment)) continue;
            day(r.day).sales += net(r.count * (PRICES_USD[r.product_id] || 0));
            day(r.day).n += r.count;
          } else {
            day(r.day).ads += adMoney(r.ad_kind, r.count);
            day(r.day).adN += r.count;
          }
        }
        const dayKeys = [];
        if (days) {
          for (let i = days - 1; i >= 0; i--) {
            const t = new Date(Date.now() - i * 86400000);
            dayKeys.push(t.toLocaleDateString('en-CA', { timeZone: 'Europe/Istanbul' }));
          }
        } else dayKeys.push(...Object.keys(series).sort());

        const rangeSel = h(
          'select',
          {
            onchange: (e) => {
              est.days = e.target.value;
              saveEst(est);
              show('earnings');
            },
          },
          [
            ['1', 'Bugün'],
            ['7', 'Son 7 gün'],
            ['30', 'Son 30 gün'],
            ['90', 'Son 90 gün'],
            ['all', 'Tüm zamanlar'],
          ].map(([v, l]) => h('option', { value: v, selected: est.days === v ? true : null }, l)),
        );
        const testToggle = h(
          'label',
          { style: 'display:flex;gap:6px;align-items:center' },
          h('input', {
            type: 'checkbox',
            checked: est.tests,
            onchange: (e) => {
              est.tests = e.target.checked;
              saveEst(est);
              show('earnings');
            },
          }),
          'Test (TestFlight/Sandbox) satın almalarını da say',
        );

        const tile = (value, label, sub) =>
          h(
            'div',
            { class: 'stat' },
            h('b', {}, value),
            h('span', { class: 'muted' }, label),
            sub ? h('div', { class: 'muted', style: 'font-size:12px' }, sub) : null,
          );

        const maxDay = Math.max(
          0.01,
          ...dayKeys.map((k) => (series[k]?.sales || 0) + (series[k]?.ads || 0)),
        );
        const chart = h(
          'div',
          { class: 'earn-chart' },
          dayKeys.map((k) => {
            const s = series[k] || { sales: 0, ads: 0, n: 0, adN: 0 };
            const title = `${k}\nSatış (net): ${usd(s.sales)} · ${s.n} adet\nReklam (tahmini): ${usd(s.ads)} · ${s.adN} izlenme`;
            return h(
              'div',
              { class: 'earn-col', title, onclick: () => toast(title.replace(/\n/g, ' · ')) },
              h('div', { class: 'earn-bar ads', style: `height:${(s.ads / maxDay) * 100}%` }),
              h('div', { class: 'earn-bar sales', style: `height:${(s.sales / maxDay) * 100}%` }),
            );
          }),
        );

        const num = (key, label, suffix) => {
          const input = h('input', {
            type: 'number',
            step: '0.5',
            min: '0',
            value: String(est[key]),
            style: 'width:90px',
            onchange: (e) => {
              const v = Number(e.target.value);
              if (!(v >= 0) || (key === 'fee' && v > 100)) return toast('Geçersiz değer', true);
              est[key] = v;
              saveEst(est);
              show('earnings');
            },
          });
          return h(
            'label',
            { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
            h('span', { style: 'flex:0 0 260px;max-width:100%' }, label),
            input,
            suffix,
          );
        };

        setMain(
          h('h2', {}, 'Kazançlar'),
          h('div', { class: 'row', style: 'gap:16px;flex-wrap:wrap' }, rangeSel, testToggle),
          testCount && !est.tests
            ? h(
                'p',
                { class: 'muted' },
                `${testCount} test satın alması (TestFlight/Sandbox) gizli; bunlar gerçek para değil.`,
              )
            : null,
          h(
            'div',
            { class: 'grid' },
            tile(usd(gross), 'Satış (brüt)', `${sales} satış`),
            tile(usd(net(gross)), `Satış (net, Apple %${est.fee} sonrası)`),
            tile(usd(adEst), 'Reklam geliri (tahmini)', "Kesin rakam AdMob'da"),
            tile(usd(net(gross) + adEst), 'Toplam (tahmini)'),
            tile(rewarded, 'Ödüllü reklam izlendi'),
            tile(inter, 'Geçiş reklamı gösterildi'),
            tile(banners, 'Banner gösterildi'),
            tile(adsToday, 'Bugün izlenen reklam'),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Günlük'),
            dayKeys.length
              ? h(
                  'div',
                  {},
                  h('div', { class: 'chart-max muted' }, 'En yüksek gün: ' + usd(maxDay)),
                  chart,
                  h(
                    'div',
                    { class: 'chart-ends muted' },
                    h('span', {}, fmtDay(dayKeys[0])),
                    h('span', {}, fmtDay(dayKeys[dayKeys.length - 1])),
                  ),
                )
              : h('p', { class: 'muted' }, 'Bu dönemde veri yok.'),
            h(
              'p',
              { class: 'muted' },
              h('span', { class: 'earn-key sales' }),
              ' Satış (net)  ',
              h('span', { class: 'earn-key ads' }),
              ' Reklam (tahmini). Çubuğa dokununca/üstüne gelince o günün ayrıntısı görünür.',
            ),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Satışlar'),
            productRows.length
              ? h(
                  'table',
                  {},
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      h('th', {}, 'Ürün'),
                      h('th', {}, 'Adet'),
                      h('th', {}, 'Fiyat'),
                      h('th', {}, 'Brüt'),
                      h('th', {}, 'Net'),
                    ),
                  ),
                  h(
                    'tbody',
                    {},
                    productRows.map((r) =>
                      h(
                        'tr',
                        {},
                        h('td', {}, EARN_LABELS[r.id] || r.id),
                        h('td', {}, r.n),
                        h('td', {}, PRICES_USD[r.id] != null ? usd(PRICES_USD[r.id]) : '—'),
                        h('td', {}, usd(r.gross)),
                        h('td', {}, usd(net(r.gross))),
                      ),
                    ),
                  ),
                )
              : h('p', { class: 'muted' }, 'Bu dönemde satış yok.'),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Reklamlar'),
            adRows.length
              ? h(
                  'table',
                  {},
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      h('th', {}, 'Tür'),
                      h('th', {}, 'Bugün'),
                      h('th', {}, 'Dönem'),
                      h('th', {}, 'Tahmini gelir'),
                    ),
                  ),
                  h(
                    'tbody',
                    {},
                    adRows.map((a) =>
                      h(
                        'tr',
                        {},
                        h('td', {}, AD_KIND_LABELS[a.key] || a.key),
                        h('td', {}, a.today),
                        h('td', {}, a.n),
                        h('td', {}, usd(a.money)),
                      ),
                    ),
                  ),
                )
              : h('p', { class: 'muted' }, 'Bu dönemde izlenen reklam yok.'),
            h(
              'p',
              { class: 'muted' },
              "Ödüllü reklamlar AdMob'un sunucu doğrulamasıyla sayılır. Geçiş reklamları uygulamanın bu güncellemesinden itibaren sayılır" +
                (d.interstitial_logging_since
                  ? ` (ilk kayıt ${fmtDate(d.interstitial_logging_since)}).`
                  : '.'),
            ),
          ),
          h(
            'div',
            { class: 'panel' },
            h('h2', {}, 'Tahmin ayarları'),
            h(
              'p',
              { class: 'muted' },
              'Bu değerler yalnızca bu tarayıcıda saklanır ve sadece tahmini hesaplamayı değiştirir.',
            ),
            num('fee', 'Apple komisyonu', '%'),
            num('rewarded', 'Ödüllü reklam: 1000 izlenme başına', '$ (eCPM)'),
            num('interstitial', 'Geçiş reklamı: 1000 gösterim başına', '$ (eCPM)'),
            num('banner', 'Banner: 1000 gösterim başına', '$ (eCPM)'),
            h(

      };
      // Whole word or phrase, any case, Turkish i/ı/İ/I alike, any spacing, ' or ’.
      // Keep in step with to_pattern() in scripts/build_moderation.py.
      const toPattern = (entry) => {
        const e = entry.trim();
        let body = '';
        for (const ch of e.toLocaleLowerCase('tr')) {
          if (ch === 'i' || ch === 'ı') body += '[iıİI]';
          else if (ch === "'" || ch === '’') body += "['’]";
          else if (/\s/.test(ch)) body += body.endsWith('\\s+') ? '' : '\\s+';
          else if ('\\.^$|?*+()[]{}'.includes(ch)) body += '\\' + ch;
          else body += ch;
        }
        const word = (c) => /[\p{L}\p{N}]/u.test(c);
        const start = word(e[0]) ? '\\m' : '(?<![[:alnum:]_])';
        const end = word(e[e.length - 1]) ? '\\M' : '(?![[:alnum:]_])';
        return start + body + end;
      };

      // Text format: a question per block; choices start with '-', '*' or 'A)';
      // '=> result title' after a choice links it to a result (Discover Yourself).
      function parseBulk(text, quiz, locale) {
        const scored = quiz.category === 'personality' || quiz.category === 'solo';
        const outcomeByName = new Map();
        quiz.outcomes.forEach((o, i) => {
          for (const l of LOCALES) {
            const t = o.translations?.[l]?.title;
            if (t) outcomeByName.set(t.trim().toLocaleLowerCase('tr'), o.id);
          }
          outcomeByName.set(String(i + 1), o.id);
        });
        const blocks = text
          .replace(/\r/g, '')
          .split(/\n\s*\n/)
          .map((b) =>
            b
              .split('\n')
              .map((l) => l.trim())
              .filter(Boolean),
          )
          .filter((b) => b.length);
        const out = [];
        const errors = [];
        blocks.forEach((lines, bi) => {
          const n = bi + 1;
          const isOpt = (l) => /^([-*•]|[A-Fa-f][).]|\d+[).])\s*/.test(l);
          const qLines = lines.filter((l) => !isOpt(l));
          const optLines = lines.filter(isOpt);
          if (!qLines.length) return errors.push(`${n}. soru: soru metni yok`);
          if (optLines.length < 2) return errors.push(`${n}. soru: en az 2 şık gerekli`);
          const options = optLines.map((l) => {
            const raw = l.replace(/^([-*•]|[A-Fa-f][).]|\d+[).])\s*/, '');
            const [body, target] = raw.split(/\s*(?:=>|→)\s*/);
            let outcome_id = null;
            if (scored && target) {
              outcome_id = outcomeByName.get(target.trim().toLocaleLowerCase('tr')) || null;
              if (!outcome_id)
                errors.push(`${n}. soru, "${body}": "${target}" adında bir sonuç yok`);
            }
            return { id: uuid(), outcome_id, translations: { [locale]: body } };
          });
          out.push({
            id: uuid(),
            tier: 'base',
            dimension: null,
            translations: { [locale]: qLines.join(' ') },
            options,
          });
        });
        return { questions: out, errors };
      }
      function openBulkAdd(quiz, done) {
        const scored = quiz.category === 'personality' || quiz.category === 'solo';
        const tiered = quiz.category === 'couples';
        const example = scored
          ? `Hafta sonu ilk ne yaparsın?\n- Yeni bir şey denerim => ${quiz.outcomes[0]?.translations?.tr?.title || 'Sonuç 1'}\n- Evde dinlenirim => ${quiz.outcomes[1]?.translations?.tr?.title || 'Sonuç 2'}\n\nEn sevdiğin mevsim?\n- Yaz => 1\n- Kış => 2`
          : 'Tatilde plan mı, sürpriz mi?\n- Her şey planlı\n- Biraz plan, biraz sürpriz\n- Tamamen sürpriz\n\nSabah insanı mısın?\n- Evet\n- Hayır';
        const area = h('textarea', {
          rows: 12,
          placeholder: example,
          style: 'width:100%;font-family:inherit',
        });
        const lang = h(
          'select',
          {},
          LOCALES.map((l) =>
            h('option', { value: l, selected: l === editLocale ? true : null }, LOCALE_NAMES[l]),
          ),
        );
        const tier = tiered
          ? h(
              'select',
              {},
              Object.entries(TIER_NAMES).map(([k, v]) => h('option', { value: k }, v)),
            )
          : null;
        const preview = h('div', { class: 'bulk-preview' });
        let parsed = { questions: [], errors: [] };
        // Result choices made in the preview survive further typing (key: question:choice).
        const picks = new Map();
        const assignInOrder = (onlyEmpty) => {
          parsed.questions.forEach((q, qi) =>
            q.options.forEach((o, oi) => {
              const key = `${qi}:${oi}`;
              if (onlyEmpty && (o.outcome_id || picks.get(key))) return;
              const target = quiz.outcomes[oi % quiz.outcomes.length];
              if (target) picks.set(key, target.id);
            }),
          );
          refresh();
        };
        const outcomeSelect = (o, qi, oi) =>
          h(
            'select',
            {
              class: o.outcome_id ? '' : 'missing',
              'aria-label': 'Sonuç',
              onchange: (e) => {
                picks.set(`${qi}:${oi}`, e.target.value || null);
                refresh();
              },
            },
            h('option', { value: '' }, '— sonuç seç —'),
            quiz.outcomes.map((oc, ci) =>
              h(
                'option',
                { value: oc.id, selected: oc.id === o.outcome_id ? true : null },
                `${ci + 1}. ${outcomeLabel(quiz, oc.id)}`,
              ),
            ),
          );
        const refresh = () => {
          parsed = parseBulk(area.value, quiz, lang.value);
          let unassigned = 0;
          parsed.questions.forEach((q, qi) =>
            q.options.forEach((o, oi) => {
              const pick = picks.get(`${qi}:${oi}`);
              if (pick) o.outcome_id = pick;
              if (scored && !o.outcome_id) unassigned++;
            }),
          );
          const ready = parsed.questions.length > 0 && !parsed.errors.length && !unassigned;
          preview.replaceChildren(
            ...[
              parsed.questions.length || parsed.errors.length
                ? h(
                    'p',
                    { class: ready ? 'muted' : 'bad-text' },
                    `${parsed.questions.length} soru okundu` +
                      (parsed.errors.length ? `, ${parsed.errors.length} sorun var` : '') +
                      (unassigned ? ` · ${unassigned} şıkkın sonucu seçilmedi` : '') +
                      (ready ? '. Hazır.' : ''),
                  )
                : h('p', { class: 'muted' }, 'Yazdıkça burada önizleme görünür.'),
              scored && parsed.questions.length && quiz.outcomes.length
                ? h(
                    'div',
                    { class: 'row', style: 'margin-bottom:8px;gap:8px;flex-wrap:wrap' },
                    h(
                      'button',
                      { class: 'btn small', type: 'button', onclick: () => assignInOrder(true) },
                      'Boşları sırayla doldur',
                    ),
                    h(
                      'button',
                      { class: 'btn small', type: 'button', onclick: () => assignInOrder(false) },
                      'Hepsini sırayla bağla (A→1, B→2…)',
                    ),
                  )
                : null,
              parsed.errors.length
                ? h(
                    'ul',
                    { class: 'bad-text' },
                    parsed.errors.slice(0, 8).map((e) => h('li', {}, e)),
                  )
                : null,
              ...parsed.questions.slice(0, 50).map((q, qi) =>
                h(
                  'div',
                  { class: 'q' },
                  h('b', {}, `${qi + 1}. ${q.translations[lang.value]}`),
                  h(
                    'div',
                    { class: 'bulk-opts' },
                    q.options.map((o, oi) =>
                      h(
                        'div',
                        { class: 'bulk-opt' },
                        h(
                          'span',
                          {},
                          `${String.fromCharCode(65 + oi)}) ${o.translations[lang.value]}`,
                        ),
                        scored ? outcomeSelect(o, qi, oi) : null,
                      ),
                    ),
                  ),
                ),
              ),
            ].filter(Boolean),
          );
          addBtn.disabled = !ready;
          addBtn.textContent = parsed.questions.length
            ? `${parsed.questions.length} soruyu ekle`
            : 'Ekle';
        };
        const addBtn = h(
          'button',
          {
            class: 'btn primary',
            type: 'button',
            disabled: true,
            onclick: () => {
              parsed.questions.forEach((q) => (q.tier = tier ? tier.value : 'base'));
              quiz.questions.push(...parsed.questions);
              sheet.close();
              done();
              toast(`${parsed.questions.length} soru eklendi. Kaydetmeyi unutma.`);
            },
          },
          'Ekle',
        );
        area.addEventListener('input', refresh);
        lang.addEventListener('change', refresh);
        const sheet = openSheet(
          h(
            'div',
            {},
            h('b', {}, '⚡ Toplu soru ekle'),
            h('div', { class: 'muted' }, 'Yapıştır, önizle, ekle'),
          ),
          h(
            'p',
            { class: 'muted' },
            'Her soruyu boş bir satırla ayır. Şıkları "-" ile başlat.' +
              (scored
                ? ' Sonucu önizlemede her şıkkın yanından seçebilir ya da "sırayla doldur" ile otomatik bağlayabilirsin. İstersen metinde şıkkın sonuna "=> Sonuç adı" (veya numarası) da yazabilirsin.'
                : ''),
          ),
          h(
            'div',
            { class: 'row', style: 'margin:8px 0' },
            h('span', { class: 'muted' }, 'Dil:'),
            lang,
            tier ? h('span', { class: 'muted' }, 'Paket:') : null,
            tier,
          ),
          area,
          preview,
          h(
            'div',
            { class: 'row', style: 'margin-top:12px' },
            addBtn,
            h(
              'span',
              { class: 'muted' },
              'Diğer dilleri sonra doldurabilir ya da bana "çevirileri tamamla" diyebilirsin.',
            ),
          ),
        );
        sheet.dlg.classList.add('wide');
        refresh();
      }
      function outcomeLabel(quiz, id) {
        const i = quiz.outcomes.findIndex((o) => o.id === id);
        if (i < 0) return '—';
        const o = quiz.outcomes[i];
        return o.translations?.tr?.title || o.translations?.en?.title || `Sonuç ${i + 1}`;
      }

      let editLocale = 'tr';
      async function openEditor(id) {
        const quiz = id
          ? await rpc('admin_quiz_get', { p_quiz: id })
          : {
              id: uuid(),
              slug: '',
              category: 'friends',
              status: 'draft',
              sort_order: 0,
              play_mode: 'prediction',
              translations: {},
              outcomes: [],
              questions: [],
            };
        quiz._settings = id
          ? await rpc('admin_quiz_settings', { p_quiz: id }).catch(() => null)
          : { shuffle_questions: false, shuffle_options: false, pool_size: null };
        dirty = false;
        renderEditor(quiz, !id);
      }

      function renderEditor(quiz, isNew) {
        const markDirty = () => {
          dirty = true;
        };
        const scored = () => quiz.category === 'personality' || quiz.category === 'solo';
        const tiered = () => quiz.category === 'couples';
        const tr = (obj, key = editLocale) => (obj || {})[key] || '';

        const localeSel = h(
          'select',
          {
            onchange: (e) => {
              editLocale = e.target.value;
              renderEditor(quiz, isNew);
            },
          },
          LOCALES.map((l) =>
            h('option', { value: l, selected: l === editLocale ? true : null }, LOCALE_NAMES[l]),
          ),
        );
        const refNote = (obj) =>
          editLocale !== 'en' && obj?.en
            ? h(
                'div',
                { class: 'ref' },
                'EN: ' + (typeof obj.en === 'string' ? obj.en : obj.en.title),
              )
            : null;

        // --- meta ---
        const slug = h('input', {
          type: 'text',
          value: quiz.slug,
          placeholder: 'ornek-quiz-adi',
          oninput: (e) => {
            quiz.slug = e.target.value;
            markDirty();
          },
        });
        const cat = h(
          'select',
          {
            onchange: (e) => {
              quiz.category = e.target.value;
              markDirty();
              renderEditor(quiz, isNew);
            },
          },
          Object.entries(CATEGORY_NAMES).map(([k, v]) =>
            h('option', { value: k, selected: k === quiz.category ? true : null }, v),
          ),
        );
        const mode = h(
          'select',
          {
            onchange: (e) => {
              quiz.play_mode = e.target.value;
              markDirty();
            },
          },
          h(
            'option',
            { value: 'match', selected: quiz.play_mode === 'match' ? true : null },
            'Eşleşme (aynı cevap = uyum)',
          ),
          h(
            'option',
            { value: 'prediction', selected: quiz.play_mode === 'prediction' ? true : null },
            'Tahmin (önce kendin, sonra arkadaşını tahmin et)',
          ),
        );
        const sort = h('input', {
          type: 'number',
          value: quiz.sort_order,
          style: 'width:80px',
          oninput: (e) => {
            quiz.sort_order = Number(e.target.value) || 0;
            markDirty();
          },
        });
        const status = h(
          'select',
          {
            onchange: (e) => {
              quiz.status = e.target.value;
              markDirty();
            },
          },
          ['draft', 'published', 'archived'].map((s) =>
            h(
              'option',
              { value: s, selected: s === quiz.status ? true : null },
              { draft: 'Taslak', published: 'Yayında', archived: 'Arşiv' }[s],
            ),
          ),
        );
        const title = h('input', {
          type: 'text',
          value: tr(quiz.translations)?.title || '',
          style: 'width:100%',
          oninput: (e) => {
            quiz.translations[editLocale] = {
              ...(quiz.translations[editLocale] || {}),
              title: e.target.value,
            };
            markDirty();
          },
        });
        const desc = h(
          'textarea',
          {
            oninput: (e) => {
              quiz.translations[editLocale] = {
                ...(quiz.translations[editLocale] || {}),
                description: e.target.value,
              };
              markDirty();
            },
          },
          tr(quiz.translations)?.description || '',
        );

        // --- outcomes (scored quizzes) ---
        const outcomesPanel = !scored()
          ? null
          : h(
              'div',
              { class: 'panel' },
              h('h3', {}, 'Sonuçlar'),
              h(
                'p',
                { class: 'muted' },
                'Her şık bir sonuca bağlanır; en çok seçilen sonuç kişinin sonucu olur.',
              ),
              quiz.outcomes.map((o, i) =>
                h(
                  'div',
                  { class: 'q' },
                  h(
                    'div',
                    { class: 'row' },
                    h('b', {}, `Sonuç ${i + 1}`),
                    h(
                      'button',
                      {
                        class: 'btn small danger',
                        onclick: async () => {
                          if (
                            await confirmAsk(
                              'Bu sonuç silinsin mi?',
                              'Ona bağlı şıklar boşa düşer.',
                              'Sil',
                            )
                          ) {
                            quiz.outcomes.splice(i, 1);
                            markDirty();
                            renderEditor(quiz, isNew);
                          }
                        },
                      },
                      'Sil',
                    ),
                  ),
                  h('input', {
                    type: 'text',
                    placeholder: 'Sonuç adı',
                    value: tr(o.translations)?.title || '',
                    style: 'width:100%;margin-top:6px',
                    oninput: (e) => {
                      o.translations[editLocale] = {
                        ...(o.translations[editLocale] || {}),
                        title: e.target.value,
                      };
                      markDirty();
                    },
                  }),
                  refNote(o.translations),
                  h(
                    'textarea',
                    {
                      placeholder: 'Açıklama',
                      oninput: (e) => {
                        o.translations[editLocale] = {
                          ...(o.translations[editLocale] || {}),
                          description: e.target.value,
                        };
                        markDirty();
                      },
                    },
                    tr(o.translations)?.description || '',
                  ),
                ),
              ),
              h(
                'button',
                {
                  class: 'btn',
                  onclick: () => {
                    quiz.outcomes.push({ id: uuid(), translations: {} });
                    markDirty();
                    renderEditor(quiz, isNew);
                  },
                },
                '+ Sonuç ekle',
              ),
            );

        // --- questions ---
        const outcomeName = (o, i) =>
          tr(o.translations)?.title ||
          o.translations?.en?.title ||
          o.translations?.tr?.title ||
          `Sonuç ${i + 1}`;
        const moveQ = (i, d) => {
          const j = i + d;
          if (j < 0 || j >= quiz.questions.length) return;
          [quiz.questions[i], quiz.questions[j]] = [quiz.questions[j], quiz.questions[i]];
          markDirty();
          renderEditor(quiz, isNew);
        };
        const questionCards = quiz.questions.map((qn, i) => {
          const filled = LOCALES.filter((l) => qn.translations?.[l]).length;
          return h(
            'div',
            { class: 'q ' + (qn.tier || 'base') },
            h(
              'div',
              { class: 'row', style: 'justify-content:space-between' },
              h(
                'div',
                { class: 'row' },
                h('b', {}, `Soru ${i + 1}`),
                tiered()
                  ? h(
                      'select',
                      {
                        onchange: (e) => {
                          qn.tier = e.target.value;
                          markDirty();
                          renderEditor(quiz, isNew);
                        },
                      },
                      Object.entries(TIER_NAMES).map(([k, v]) =>
                        h(
                          'option',
                          { value: k, selected: k === (qn.tier || 'base') ? true : null },
                          v,
                        ),
                      ),
                    )
                  : null,
                DIMENSIONS[quiz.category]
                  ? h(
                      'select',
                      {
                        title: 'Analiz boyutu',
                        onchange: (e) => {
                          qn.dimension = e.target.value || null;
                          markDirty();
                        },
                      },
                      [
                        h('option', { value: '' }, 'Boyut yok'),
                        ...Object.entries(DIMENSIONS[quiz.category]).map(([k, v]) =>
                          h('option', { value: k, selected: k === qn.dimension ? true : null }, v),
                        ),
                      ],
                    )
                  : null,
                h('span', { class: 'tag ' + (filled === 7 ? 'green' : 'gray') }, `${filled}/7 dil`),
              ),
              h(
                'div',
                { class: 'row' },
                h(
                  'button',
                  {
                    class: 'btn small',
                    title: 'Çoğalt',
                    onclick: () => {
                      quiz.questions.splice(i + 1, 0, {
                        id: uuid(),
                        tier: qn.tier || 'base',
                        dimension: qn.dimension || null,
                        translations: { ...qn.translations },
                        options: qn.options.map((o) => ({
                          id: uuid(),
                          outcome_id: o.outcome_id || null,
                          translations: { ...o.translations },
                        })),
                      });
                      markDirty();
                      renderEditor(quiz, isNew);
                    },
                  },
                  'Çoğalt',
                ),
                h(
                  'button',
                  { class: 'btn small', title: 'Yukarı', onclick: () => moveQ(i, -1) },
                  '↑',
                ),
                h(
                  'button',
                  { class: 'btn small', title: 'Aşağı', onclick: () => moveQ(i, 1) },
                  '↓',
                ),
                h(
                  'button',
                  {
                    class: 'btn small danger',
                    onclick: async () => {
                      if (await confirmAsk('Soru silinsin mi?', '', 'Sil')) {
                        quiz.questions.splice(i, 1);
                        markDirty();
                        renderEditor(quiz, isNew);
                      }
                    },
                  },
                  'Sil',
                ),
              ),
            ),
            h(
              'textarea',
              {
                placeholder: `Soru metni (${LOCALE_NAMES[editLocale]})`,
                style: 'margin-top:6px',
                class: !tr(qn.translations) && filled ? 'missing' : null,
                oninput: (e) => {
                  qn.translations[editLocale] = e.target.value;
                  markDirty();
                },
              },
              tr(qn.translations),
            ),
            refNote(qn.translations),
            qn.options.map((op, k) =>
              h(
                'div',
                { class: 'opt' },
                h('span', { class: 'muted' }, String.fromCharCode(65 + k)),
                h('input', {
                  type: 'text',
                  placeholder: 'Şık',
                  class:
                    !tr(op.translations) && Object.keys(op.translations || {}).length
                      ? 'missing'
                      : null,
                  value: tr(op.translations),
                  oninput: (e) => {
                    op.translations[editLocale] = e.target.value;
                    markDirty();
                  },
                }),
                scored()
                  ? h(
                      'select',
                      {
                        onchange: (e) => {
                          op.outcome_id = e.target.value || null;
                          markDirty();
                        },
                      },
                      h('option', { value: '' }, '— sonuç seç —'),
                      quiz.outcomes.map((o, oi) =>
                        h(
                          'option',
                          { value: o.id, selected: o.id === op.outcome_id ? true : null },
                          outcomeName(o, oi),
                        ),
                      ),
                    )
                  : null,
                h(
                  'button',
                  {
                    class: 'btn small',
                    title: 'Şıkkı sil',
                    disabled: qn.options.length <= 2 ? true : null,
                    onclick: () => {
                      qn.options.splice(k, 1);
                      markDirty();
                      renderEditor(quiz, isNew);
                    },
                  },
                  '×',
                ),
              ),
            ),
            h(
              'button',
              {
                class: 'btn small',
                style: 'margin-top:8px',
                onclick: () => {
                  qn.options.push({ id: uuid(), outcome_id: null, translations: {} });
                  markDirty();
                  renderEditor(quiz, isNew);
                },
              },
              '+ Şık',
            ),
          );
        });
        const addQuestion = () => {
          // New questions start with the same answer choices as the first question (e.g. Always / Depends / Never).
          const tpl = quiz.questions[0]?.options;
          const options = tpl
            ? tpl.map((o) => ({
                id: uuid(),
                outcome_id: scored() ? o.outcome_id : null,
                translations: { ...o.translations },
              }))
            : [
                { id: uuid(), outcome_id: null, translations: {} },
                { id: uuid(), outcome_id: null, translations: {} },
              ];
          const tier = tiered() ? quiz.questions.at(-1)?.tier || 'base' : 'base';
          const dimension = quiz.questions.at(-1)?.dimension || null;
          quiz.questions.push({ id: uuid(), tier, dimension, translations: {}, options });
          markDirty();
          renderEditor(quiz, isNew);
          setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
        };

        const missing = LOCALES.map((l) => [
          l,
          quiz.questions.filter((q) => !q.translations?.[l]).length,
        ]).filter(([, n]) => n);
        const counts = ['base', 'ad', 'premium']
          .map((t) => [t, quiz.questions.filter((q) => (q.tier || 'base') === t).length])
          .filter(([, n]) => n);

        const saveBtn = h(
          'button',
          {
            class: 'btn primary',
            onclick: async () => {
              // Questions are saved grouped by tier (base, then ad, then premium) in this order.
              const order = { base: 0, ad: 1, premium: 2 };
              const payload = {
                ...quiz,
                questions: [...quiz.questions].sort(
                  (a, b) => order[a.tier || 'base'] - order[b.tier || 'base'],
                ),
              };
              saveBtn.disabled = true;
              try {
                const { _settings, ...clean } = payload;
                const saved = await rpc('admin_quiz_save', { p: clean });
                if (_settings)
                  saved._settings = await rpc('admin_quiz_settings_set', {
                    p_quiz: saved.id,
                    p_shuffle_questions: !!_settings.shuffle_questions,
                    p_shuffle_options: !!_settings.shuffle_options,
                    p_pool_size: _settings.pool_size || null,
                  });
                dirty = false;
                toast('Kaydedildi');
                renderEditor(saved, false);
              } catch (e) {
                toast(errText(e), true);
                saveBtn.disabled = false;
              }
            },
          },
          'Kaydet',
        );

        setMain(
          h(
            'div',
            { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' },
            h('button', { class: 'btn', onclick: () => show('content') }, '← Quiz listesi'),
            h('div', { class: 'row' }, h('span', { class: 'muted' }, 'Düzenlenen dil:'), localeSel),
          ),
          h(
            'div',
            { class: 'panel' },
            h(
              'h2',
              {},
              isNew
                ? 'Yeni quiz'
                : quiz.translations.tr?.title || quiz.translations.en?.title || quiz.slug,
            ),
            h(
              'div',
              { class: 'row' },
              h('label', { class: 'field' }, h('span', {}, 'Bölüm'), cat),
              h(
                'label',
                { class: 'field' },
                h('span', {}, 'Kısa ad (URL, küçük harf ve tire)'),
                slug,
              ),
              quiz.category === 'friends' || quiz.category === 'couples'
                ? h('label', { class: 'field' }, h('span', {}, 'Oyun türü'), mode)
                : null,
              h('label', { class: 'field' }, h('span', {}, 'Sıra'), sort),
              h('label', { class: 'field' }, h('span', {}, 'Durum'), status),
            ),
            h(
              'label',
              { class: 'field', style: 'margin-top:12px' },
              h('span', {}, `Başlık (${LOCALE_NAMES[editLocale]})`),
              title,
            ),
            refNote(quiz.translations),
            h(
              'label',
              { class: 'field', style: 'margin-top:8px' },
              h('span', {}, `Açıklama (${LOCALE_NAMES[editLocale]})`),
              desc,
            ),
            tiered()
              ? h(
                  'p',
                  { class: 'muted' },
                  'Couple Match: Temel sorular herkese açık; Reklamlı ve Premium sorular ek paketlerdir. Sıralama paket içinde geçerlidir.',
                )
              : null,
          ),
          playPanel(quiz, markDirty),
          outcomesPanel,
          h(
            'div',
            {},
            h(
              'div',
              { class: 'row', style: 'justify-content:space-between;align-items:center' },
              h('h3', {}, `Sorular (${quiz.questions.length})`),
              h(
                'button',
                {
                  class: 'btn',
                  onclick: () =>
                    openBulkAdd(quiz, () => {
                      markDirty();
                      renderEditor(quiz, isNew);
                    }),
                },
                '⚡ Toplu ekle',
              ),
            ),
            questionCards,
            h(
              'div',
              { class: 'row' },
              h('button', { class: 'btn', onclick: addQuestion }, '+ Soru ekle'),
              h(
                'button',
                {
                  class: 'btn',
                  onclick: () =>
                    openBulkAdd(quiz, () => {
                      markDirty();
                      renderEditor(quiz, isNew);
                    }),
                },
                '⚡ Toplu ekle',
              ),
            ),
          ),
          h(
            'div',
            { class: 'sticky-save' },
            saveBtn,
            h(
              'span',
              { class: 'muted' },
              counts.map(([t, n]) => `${TIER_NAMES[t]}: ${n}`).join(' · '),
            ),
            missing.length
              ? h(
                  'span',
                  { class: 'muted' },
                  ' · Eksik çeviri: ' +
                    missing.map(([l, n]) => `${l.toUpperCase()} ${n}`).join(', '),
                )
              : null,
            quiz.status === 'published'
              ? h('span', { class: 'tag green' }, 'Kaydedince hemen yayına girer')
              : null,
          ),
        );
      }

      const VIEWS = {
        overview: viewOverview,
        health: viewHealth,
        audit: viewAudit,
        earnings: viewEarnings,
        users: viewUsers,
        reports: viewReports,
        content: viewContent,
        settings: viewSettings,
      };
      sb.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') renderLogin();
      });
      start();
    </script>
  </body>
</html>
